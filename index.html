/* Layout : colonne au pouce sur fond dégradé pastel, cartes en verre dépoli, barre d’onglets flottante ; thème sombre en option. */
:root {
  color-scheme: light;
  --page: linear-gradient(165deg, #CBEEE3 0%, #E6F5EF 34%, #F7F3EC 64%, #FFE0CF 100%);
  --blob1: rgba(18, 160, 132, .22); --blob2: rgba(255, 150, 115, .26);
  --fg: #14302A; --muted: #586F6A; --dim: #7A8F8A;
  --glass: rgba(255, 255, 255, .66); --glass2: rgba(255, 255, 255, .9); --brd: rgba(255, 255, 255, .85);
  --line: rgba(20, 48, 42, .08); --line2: rgba(20, 48, 42, .14); --tint: rgba(20, 48, 42, .05); --tint2: rgba(20, 48, 42, .085);
  --shadow: 0 16px 36px -18px rgba(18, 72, 60, .32), 0 2px 6px -2px rgba(18, 72, 60, .08);
  --acc: #0F8A72; --acc2: #0B735F; --acc-ink: #FFFFFF; --acc-soft: rgba(15, 138, 114, .12); --acc-line: rgba(15, 138, 114, .34); --acc-glow: rgba(15, 138, 114, .45);
  --acc-grad: linear-gradient(135deg, #18A589, #0E8069);
  --run: #E3664A; --run-txt: #B94A2E; --run-ink: #FFFFFF; --run-soft: rgba(240, 123, 94, .15); --run-line: rgba(227, 102, 74, .36); --run-glow: rgba(227, 102, 74, .42);
  --run-grad: linear-gradient(135deg, #F58A6C, #E05E42);
  --warn: #A86B12; --warn-soft: rgba(232, 163, 61, .17); --bad: #C1443A; --bad-soft: rgba(220, 80, 70, .12);
  --fig: #1D4740; --fig-far: #A3C3BB; --mat: rgba(20, 48, 42, .08); --stage: linear-gradient(180deg, #E2F5EE, #F8FCFA);
  --hero: linear-gradient(145deg, rgba(255, 255, 255, .92), rgba(255, 255, 255, .58));
  --hero-run: linear-gradient(145deg, rgba(255, 255, 255, .92), rgba(255, 232, 220, .7));
  --overlay: rgba(18, 40, 35, .3); --sheet: #F6FAF8; --bar: rgba(255, 255, 255, .78); --shead: rgba(236, 247, 242, .86);
  --toast-bg: #14302A; --toast-fg: #FFFFFF; --veil: rgba(236, 247, 242, .94); --rest: rgba(255, 255, 255, .94);
  --rip: rgba(15, 138, 114, .16); --input: rgba(255, 255, 255, .92); --chart: #E9714F; --chart2: rgba(233, 113, 79, .22);
  --f-display: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 24px; --ease: cubic-bezier(.22, 1, .36, 1); --spring: cubic-bezier(.34, 1.56, .64, 1); --tab-h: 72px;
}
:root[data-ui="dark"] {
  color-scheme: dark;
  --page: linear-gradient(170deg, #0B1413 0%, #080C0D 55%, #120D0B 100%);
  --blob1: rgba(61, 242, 160, .10); --blob2: rgba(255, 130, 95, .08);
  --fg: #EDF4F1; --muted: #98A9A4; --dim: #7F908B;
  --glass: rgba(22, 31, 33, .82); --glass2: #1B2628; --brd: rgba(255, 255, 255, .06);
  --line: rgba(255, 255, 255, .07); --line2: rgba(255, 255, 255, .12); --tint: rgba(255, 255, 255, .05); --tint2: rgba(255, 255, 255, .09);
  --shadow: 0 16px 36px -18px rgba(0, 0, 0, .7);
  --acc: #3DF2A0; --acc2: #2AD98B; --acc-ink: #03160C; --acc-soft: rgba(61, 242, 160, .11); --acc-line: rgba(61, 242, 160, .32); --acc-glow: rgba(61, 242, 160, .4);
  --acc-grad: linear-gradient(135deg, #52F5AC, #2CD98C);
  --run: #FF8C6E; --run-txt: #FF9C81; --run-ink: #2A0B03; --run-soft: rgba(255, 140, 110, .13); --run-line: rgba(255, 140, 110, .36); --run-glow: rgba(255, 140, 110, .38);
  --run-grad: linear-gradient(135deg, #FFA084, #FF7C5C);
  --warn: #FFC861; --warn-soft: rgba(255, 200, 97, .11); --bad: #FF8378; --bad-soft: rgba(255, 131, 120, .12);
  --fig: #E8F0ED; --fig-far: #61746F; --mat: rgba(255, 255, 255, .07); --stage: linear-gradient(180deg, #111B1D, #0D1416);
  --hero: linear-gradient(145deg, rgba(30, 44, 44, .95), rgba(18, 26, 28, .9)); --hero-run: linear-gradient(145deg, rgba(42, 34, 32, .95), rgba(20, 24, 26, .9));
  --overlay: rgba(0, 0, 0, .6); --sheet: #131B1D; --bar: rgba(14, 20, 22, .86); --shead: rgba(8, 12, 13, .9);
  --toast-bg: #EDF4F1; --toast-fg: #0B1413; --veil: rgba(5, 8, 9, .93); --rest: rgba(18, 26, 28, .97);
  --rip: rgba(255, 255, 255, .14); --input: #0F1617; --chart: #FF8C6E; --chart2: rgba(255, 140, 110, .2);
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: #E6F5EF; }
:root[data-ui="dark"] { background: #080C0D; }
body { margin: 0; font: 400 15px/1.45 var(--f-body); color: var(--fg); background: transparent; -webkit-font-smoothing: antialiased; overflow-x: hidden; min-height: 100vh; }
body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
  background: radial-gradient(38% 26% at 92% 6%, var(--blob2), transparent 70%), radial-gradient(45% 30% at 0% 38%, var(--blob1), transparent 70%), radial-gradient(40% 25% at 100% 82%, var(--blob2), transparent 70%), var(--page); }
body.noscroll { overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 10px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.acc-t { color: var(--acc); }

/* ---------- structure ---------- */
#app { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(var(--tab-h) + 34px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 14px; }
.screen.enter-r { animation: enterR .36s var(--ease); } .screen.enter-l { animation: enterL .36s var(--ease); } .screen.enter { animation: enterU .4s var(--ease); }
@keyframes enterR { from { opacity: 0; transform: translateX(22px); } }
@keyframes enterL { from { opacity: 0; transform: translateX(-22px); } }
@keyframes enterU { from { opacity: 0; transform: translateY(12px); } }
.stagger > * { animation: rise .55s var(--ease) both; }
.stagger > *:nth-child(2) { animation-delay: .05s; } .stagger > *:nth-child(3) { animation-delay: .1s; } .stagger > *:nth-child(4) { animation-delay: .15s; } .stagger > *:nth-child(5) { animation-delay: .2s; } .stagger > *:nth-child(6) { animation-delay: .25s; } .stagger > *:nth-child(n+7) { animation-delay: .3s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 2px; }
.eyebrow { font: 600 12px/1.25 var(--f-body); letter-spacing: .02em; color: var(--muted); }
.title-xl { font: 800 30px/1.08 var(--f-display); letter-spacing: -.025em; }
.title-xl em { font-style: normal; color: var(--acc); }
.sec-t { display: flex; justify-content: space-between; align-items: baseline; font: 700 16px/1.2 var(--f-display); letter-spacing: -.01em; padding: 6px 4px 0; }
.sec-t a, .sec-t button { font: 600 13px var(--f-body); color: var(--acc); text-decoration: none; background: none; border: 0; padding: 0; }
.glass, .card, .group, .hero { background: var(--glass); border: 1px solid var(--brd); box-shadow: var(--shadow); }
.card { border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h2 { font: 700 18px/1.15 var(--f-display); letter-spacing: -.015em; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; } .row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.note { font-size: 13px; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }
.avatar { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-grad); color: #fff; font: 800 19px/1 var(--f-display); text-decoration: none; box-shadow: 0 8px 20px -10px var(--acc-glow), 0 0 0 3px var(--glass2); flex: none; transition: transform .45s var(--spring); }
.avatar:active { transform: scale(.9); }

/* ---------- héros ---------- */
.hero { position: relative; overflow: hidden; border-radius: 28px; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: var(--hero); }
.hero.run { background: var(--hero-run); }
.hero-name { font: 800 34px/1.02 var(--f-display); letter-spacing: -.03em; }
.hero-sub { color: var(--muted); font-size: 14.5px; margin-top: -6px; }
.hero-grid { display: grid; grid-template-columns: 1fr 42%; gap: 6px; align-items: center; }
.hero-grid > div { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.hero-art { position: relative; aspect-ratio: 1; border-radius: 22px; overflow: hidden; background: var(--stage); }
.hero-art .fig { position: absolute; width: 150%; left: -25%; top: 10%; background: transparent; }
.hero-art::after { content: ''; position: absolute; inset: auto 12% 10% 12%; height: 12%; border-radius: 50%; background: radial-gradient(closest-side, rgba(20, 48, 42, .18), transparent); }
.hero.run .hero-art { background: linear-gradient(180deg, #FFE8DC, #FFF6F1); }
:root[data-ui="dark"] .hero.run .hero-art { background: linear-gradient(180deg, #2A201D, #191513); }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13.5px; color: var(--muted); align-items: baseline; }
.meta b { color: var(--fg); font: 800 18px/1 var(--f-display); margin-right: 3px; font-variant-numeric: tabular-nums; }
.exmini { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; counter-reset: e; }
.exmini li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: baseline; font-size: 14.5px; counter-increment: e; }
.exmini li::before { content: counter(e); font: 800 13px/1 var(--f-display); color: var(--acc); }
.hero-foot { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

/* ---------- anneau et barres ---------- */
.wring { display: grid; grid-template-columns: 112px 1fr; gap: 16px; align-items: center; }
.wring .rg { position: relative; width: 112px; height: 112px; }
.wring svg { width: 112px; height: 112px; transform: rotate(-90deg); display: block; }
.wring circle { fill: none; stroke-width: 11; stroke-linecap: round; }
.wring .b { stroke: var(--tint2); } .wring .f { stroke: url(#ringGrad); stroke-dasharray: 289; stroke-dashoffset: 289; transition: stroke-dashoffset 1.1s var(--ease); }
.wring .pc { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.wring .pc b { font: 800 26px/1 var(--f-display); letter-spacing: -.02em; display: block; }
.wring .pc span { font-size: 11px; color: var(--muted); }
.legend { display: grid; gap: 7px; font-size: 13.5px; }
.legend div { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; }
.legend i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); }
.legend i.c { background: var(--run); } .legend i.y { background: #E8A33D; } .legend i.p { background: #7FB7AA; }
.legend b { font-weight: 700; font-variant-numeric: tabular-nums; }
.bars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 118px; padding-top: 6px; }
.bars .bc { display: flex; flex-direction: column; align-items: center; gap: 7px; height: 100%; justify-content: flex-end; }
.bars .bt { width: 12px; flex: 1; border-radius: 99px; background: var(--tint2); position: relative; overflow: hidden; display: flex; align-items: flex-end; }
.bars .bt i { display: block; width: 100%; border-radius: 99px; background: var(--acc-grad); transform-origin: bottom; animation: grow .9s var(--ease) both; }
.bars .bt i.c { background: var(--run-grad); }
.bars .bt.plan { background: transparent; box-shadow: inset 0 0 0 1.5px var(--line2); }
@keyframes grow { from { transform: scaleY(0); } }
.bars .dl { font: 600 11.5px/1 var(--f-body); color: var(--muted); width: 24px; height: 24px; display: grid; place-items: center; border-radius: 50%; }
.bars .dl.now { background: var(--acc-grad); color: #fff; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { appearance: none; border: 1px solid var(--brd); background: var(--glass); box-shadow: var(--shadow); border-radius: 20px; padding: 13px; display: grid; grid-template-columns: 38px 1fr; gap: 10px; align-items: center; text-align: left; min-height: 66px; transition: transform .45s var(--spring); text-decoration: none; color: inherit; }
.tile:active { transform: scale(.96); transition-duration: .1s; }
.tile .t { font-weight: 700; font-size: 14px; line-height: 1.2; } .tile .s { font-size: 12px; color: var(--muted); margin-top: 1px; }
.tile > div { min-width: 0; }

/* ---------- boutons et retours au toucher ---------- */
.btn, .chip, .seg button, .day, .wk, .setrow, .listrow, button.li, .footline, .tile, .wcard, .check-list button { position: relative; overflow: hidden; isolation: isolate; }
.btn { appearance: none; border: 0; background: var(--glass2); color: var(--fg); border-radius: 16px; min-height: 48px; padding: 10px 16px; box-shadow: inset 0 0 0 1px var(--line);
  font: 600 15px/1.15 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; text-decoration: none;
  transition: transform .45s var(--spring), box-shadow .3s var(--ease), opacity .2s, filter .2s; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.btn:active { transform: scale(.955); transition-duration: .1s; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--acc-grad); color: var(--acc-ink); font-weight: 700; --rip: rgba(255, 255, 255, .5); box-shadow: 0 12px 26px -12px var(--acc-glow), inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn.primary:active { box-shadow: 0 4px 12px -6px var(--acc-glow); }
.btn.runb { background: var(--run-grad); color: var(--run-ink); font-weight: 700; --rip: rgba(255, 255, 255, .5); box-shadow: 0 12px 26px -12px var(--run-glow), inset 0 1px 0 rgba(255, 255, 255, .25); }
.btn.ghost { background: transparent; box-shadow: inset 0 0 0 1px var(--line2); }
.btn.danger { background: var(--bad-soft); color: var(--bad); box-shadow: none; }
.btn.xl { min-height: 58px; border-radius: 999px; font: 700 17px/1 var(--f-display); letter-spacing: .01em; }
.btn.pill { border-radius: 999px; }
.btn.block { width: 100%; }
.btn.sm { min-height: 40px; padding: 7px 14px; font-size: 14px; border-radius: 13px; }
.btn.icon { width: 46px; min-height: 46px; padding: 0; flex: none; border-radius: 50%; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.ok { filter: brightness(1.08); } .btn.ok > * { animation: popIn .4s var(--spring); }
.go { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-grad); color: #fff; box-shadow: 0 10px 22px -10px var(--acc-glow); flex: none; }
.go svg { width: 18px; height: 18px; }
.go.c { background: var(--run-grad); box-shadow: 0 10px 22px -10px var(--run-glow); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; } .btns > .btn { flex: 1 1 auto; }
.linkbtn { appearance: none; background: none; border: 0; padding: 6px 2px; color: var(--muted); font-weight: 600; font-size: 14px; display: inline-flex; align-items: center; gap: 4px; text-decoration: none; }
.linkbtn svg { width: 16px; height: 16px; }
.shine::after { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(105deg, transparent 35%, rgba(255, 255, 255, .55) 50%, transparent 65%); transform: translateX(-120%); animation: shine 1.4s .45s var(--ease) 1 both; pointer-events: none; }
@keyframes shine { to { transform: translateX(120%); } }
.rip { position: absolute; border-radius: 50%; pointer-events: none; background: var(--rip); transform: scale(0); animation: rip .6s var(--ease) forwards; z-index: -1; }
@keyframes rip { 60% { opacity: .9; } to { transform: scale(1); opacity: 0; } }
@keyframes popIn { from { transform: scale(.4); opacity: 0; } }
.pop { animation: pop .42s var(--spring); }
@keyframes pop { 0% { transform: scale(.84); } 100% { transform: scale(1); } }
.bump { animation: bump .32s var(--spring); }
@keyframes bump { 40% { transform: scale(1.14); } }

/* ---------- pastilles, alertes ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 10px; border-radius: 999px; font: 600 12px/1.15 var(--f-body); background: var(--tint2); color: var(--muted); white-space: nowrap; }
.pill.acc { background: var(--acc-soft); color: var(--acc); } .pill.run { background: var(--run-soft); color: var(--run-txt); }
.pill.warn { background: var(--warn-soft); color: var(--warn); } .pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.solid { background: var(--acc-grad); color: var(--acc-ink); }
.pill svg { width: 13px; height: 13px; }
.alert { border-radius: 16px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; background: var(--tint); }
.alert > svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.alert.warn { background: var(--warn-soft); } .alert.warn > svg { color: var(--warn); }
.alert.bad { background: var(--bad-soft); } .alert.bad > svg { color: var(--bad); }
.alert.acc { background: var(--acc-soft); } .alert.acc > svg { color: var(--acc); }
.alert.info > svg { color: var(--run-txt); }
.footline { appearance: none; border: 0; background: var(--tint); border-radius: 16px; padding: 11px 12px; display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; font-size: 13px; color: var(--muted); transition: transform .4s var(--spring); }
.footline:active { transform: scale(.98); }
.footline svg { width: 16px; height: 16px; flex: none; color: var(--warn); }
.footline .chev { margin-left: auto; color: var(--dim); }

/* ---------- champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
.input, textarea.input, select.input { width: 100%; min-height: 48px; border-radius: 14px; border: 1px solid var(--line2); background: var(--input); padding: 10px 12px; font-size: 16px; transition: border-color .2s, box-shadow .25s; color: var(--fg); }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.4; }
.input:focus { border-color: var(--acc); outline: none; box-shadow: 0 0 0 4px var(--acc-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; min-height: 44px; min-width: 44px; padding: 8px 12px; border-radius: 14px; border: 0; background: var(--glass2); box-shadow: inset 0 0 0 1px var(--line); font: 600 15px/1 var(--f-body); color: var(--fg);
  transition: transform .45s var(--spring), background-color .2s, color .2s, box-shadow .2s; font-variant-numeric: tabular-nums; }
.chip:active { transform: scale(.9); transition-duration: .1s; }
.chip.on { background: var(--acc-grad); color: var(--acc-ink); box-shadow: 0 8px 18px -10px var(--acc-glow); --rip: rgba(255, 255, 255, .5); }
.chip.hint:not(.on) { box-shadow: inset 0 0 0 1.5px var(--acc-line); color: var(--acc); }
.chip.runon.on { background: var(--run-grad); color: var(--run-ink); box-shadow: 0 8px 18px -10px var(--run-glow); }
.chip.badon.on { background: var(--bad); color: #fff; box-shadow: none; }
.chips.grid5 { display: grid; grid-template-columns: repeat(5, 1fr); } .chips.grid6 { display: grid; grid-template-columns: repeat(6, 1fr); } .chips.grid4 { display: grid; grid-template-columns: repeat(4, 1fr); }
.chips.grid5 .chip, .chips.grid6 .chip, .chips.grid4 .chip { min-width: 0; padding-inline: 4px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; cursor: pointer; }
.toggle input, input.sw { appearance: none; -webkit-appearance: none; width: 50px; height: 30px; border-radius: 99px; background: var(--tint2); box-shadow: inset 0 0 0 1px var(--line); position: relative; flex: none; transition: background-color .25s; cursor: pointer; margin: 0; }
.toggle input::after, input.sw::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: transform .45s var(--spring), width .25s var(--ease); box-shadow: 0 2px 6px rgba(0, 0, 0, .2); }
.toggle input:checked, input.sw:checked { background: var(--acc); box-shadow: none; }
.toggle input:checked::after, input.sw:checked::after { transform: translateX(20px); }
.toggle input:active::after, input.sw:active::after { width: 30px; }
.toggle input:checked:active::after, input.sw:checked:active::after { transform: translateX(14px); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; background: var(--glass); border: 1px solid var(--brd); box-shadow: var(--shadow); border-radius: 999px; padding: 4px; }
.seg button { appearance: none; border: 0; background: transparent; border-radius: 999px; min-height: 40px; font-weight: 600; font-size: 14px; color: var(--muted); transition: color .2s, background-color .25s, transform .4s var(--spring), box-shadow .25s; padding: 0 6px; }
.seg button:active { transform: scale(.94); }
.seg button.on { background: var(--acc-grad); color: var(--acc-ink); box-shadow: 0 8px 18px -10px var(--acc-glow); }
.seg.flat { box-shadow: none; background: var(--tint); border-color: transparent; }
.stepper { display: grid; grid-template-columns: 60px 1fr 60px; gap: 8px; align-items: center; }
.stepper .btn { min-height: 62px; border-radius: 20px; }
.stepper .btn svg { width: 22px; height: 22px; }
.stepper input { text-align: center; height: 62px; font: 800 42px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; border-radius: 20px; border: 0; background: var(--glass2); box-shadow: inset 0 0 0 1px var(--line); width: 100%; min-width: 0; -moz-appearance: textfield; color: var(--fg); }
.stepper input:focus { outline: none; box-shadow: 0 0 0 2px var(--acc-line); }
.stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.stepper.sm { grid-template-columns: 46px 1fr 46px; } .stepper.sm .btn { min-height: 46px; font-size: 22px; border-radius: 14px; } .stepper.sm input { height: 46px; font-size: 24px; border-radius: 14px; }

/* ---------- listes ---------- */
.list { display: flex; flex-direction: column; }
.li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; padding: 12px 0; border-top: 1px solid var(--line); min-width: 0; }
.li:first-child { border-top: 0; }
.li > div { min-width: 0; }
.li .t { font-weight: 600; } .li .s { font-size: 13px; color: var(--muted); }
button.li { appearance: none; background: none; border-left: 0; border-right: 0; border-bottom: 0; text-align: left; width: 100%; padding-inline: 0; transition: opacity .15s; }
button.li:first-child { border-top: 0; } button.li:active { opacity: .7; }
.chev { width: 18px; height: 18px; color: var(--dim); flex: none; }
.group { border-radius: var(--r); overflow: hidden; display: flex; flex-direction: column; }
.listrow { appearance: none; border: 0; background: transparent; width: 100%; display: grid; grid-template-columns: 40px 1fr auto 18px; gap: 12px; align-items: center; padding: 11px 14px; min-height: 64px; text-align: left; transition: background-color .2s; text-decoration: none; color: inherit; }
.listrow + .listrow { box-shadow: inset 0 1px 0 var(--line); }
.listrow:active { background: var(--tint); }
.ic { width: 40px; height: 40px; border-radius: 14px; display: grid; place-items: center; background: var(--acc-soft); color: var(--acc); flex: none; transition: background-color .3s, color .3s, transform .45s var(--spring); }
.ic.run { background: var(--run-soft); color: var(--run-txt); } .ic.warn { background: var(--warn-soft); color: var(--warn); } .ic.n { background: var(--tint2); color: var(--muted); } .ic.bad { background: var(--bad-soft); color: var(--bad); }
.ic.fill { background: var(--acc-grad); color: #fff; } .ic.fill.run { background: var(--run-grad); }
.ic svg { width: 20px; height: 20px; }
.listrow .t { font-weight: 600; } .listrow .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.listrow > div { min-width: 0; }
.daily { display: grid; grid-template-columns: 40px 1fr auto; gap: 12px; align-items: center; min-height: 50px; }
.daily + .daily { box-shadow: inset 0 1px 0 var(--line); padding-top: 12px; }
.daily .t { font-weight: 600; } .daily .s { font-size: 12.5px; color: var(--muted); white-space: nowrap; }
.daily .inl { display: flex; gap: 6px; align-items: center; }
.daily .inl .input { width: 76px; min-height: 42px; padding: 8px 10px; text-align: center; font-variant-numeric: tabular-nums; }
.daily .val { font: 800 22px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.daily .val small { font: 600 13px var(--f-body); color: var(--muted); margin-left: 3px; }

/* ---------- cartes séance illustrées ---------- */
.wcard { appearance: none; border: 1px solid var(--brd); background: var(--glass); box-shadow: var(--shadow); border-radius: 24px; padding: 0; display: grid; grid-template-columns: 1fr 44%; min-height: 128px; text-align: left; width: 100%; color: inherit; transition: transform .45s var(--spring); text-decoration: none; }
.wcard:active { transform: scale(.975); transition-duration: .1s; }
.wcard .wt { padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; min-width: 0; }
.wcard .wt b { font: 800 19px/1.15 var(--f-display); letter-spacing: -.02em; }
.wcard .wt span { font-size: 12.5px; color: var(--muted); }
.wcard .wt span.go { color: #fff; }
.wcard .wa { position: relative; overflow: hidden; background: var(--stage); }
.wcard .wa .fig { position: absolute; width: 160%; left: -30%; top: 2%; background: transparent; }
.wcard.run .wa { background: linear-gradient(180deg, #FFE8DC, #FFF6F1); }
:root[data-ui="dark"] .wcard.run .wa { background: linear-gradient(180deg, #2A201D, #191513); }

/* ---------- programme ---------- */
.weekgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.wk { appearance: none; border: 0; background: var(--glass2); box-shadow: inset 0 0 0 1px var(--line); border-radius: 16px; padding: 9px 4px; text-align: center; min-height: 60px; display: flex; flex-direction: column; justify-content: center; gap: 3px; transition: transform .45s var(--spring), box-shadow .3s; color: var(--fg); }
.wk:active { transform: scale(.92); transition-duration: .1s; }
.wk b { font: 800 19px/1 var(--f-display); letter-spacing: -.02em; } .wk b small { font-size: 11px; margin-left: 1px; }
.wk span { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.wk.cur { box-shadow: inset 0 0 0 1.5px var(--acc-line); }
.wk.sel { background: var(--acc-grad); color: var(--acc-ink); box-shadow: 0 10px 22px -12px var(--acc-glow); }
.wk.sel span { color: var(--acc-ink); opacity: .82; }
.days { display: flex; flex-direction: column; gap: 6px; }
.day { appearance: none; border: 0; display: grid; grid-template-columns: 52px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 16px; background: var(--glass2); box-shadow: inset 0 0 0 1px var(--line); text-align: left; width: 100%; min-height: 56px; transition: transform .4s var(--spring); color: var(--fg); }
.day:active { transform: scale(.98); transition-duration: .1s; }
.day .dd { font: 800 14px/1.05 var(--f-display); letter-spacing: .02em; }
.day .dd small { display: block; font: 500 12px/1.2 var(--f-body); color: var(--muted); margin-top: 2px; }
.day .dw { min-width: 0; font-weight: 600; font-size: 14.5px; }
.day.today { box-shadow: inset 0 0 0 1.5px var(--acc-line); }
.day.k-run .dw { color: var(--run-txt); }
.day.k-rest, .day.k-mobility { background: transparent; } .day.k-rest .dw, .day.k-mobility .dw { color: var(--muted); font-weight: 500; }
.mini3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.mini3 > div { border-radius: 16px; background: var(--glass2); box-shadow: inset 0 0 0 1px var(--line); padding: 10px; min-width: 0; }
.mini3 b { display: block; font: 800 22px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.mini3 span { font-size: 12px; color: var(--muted); }

/* ---------- tableau / graphique ---------- */
.tablewrap { overflow-x: auto; }
table.t { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
table.t th { text-align: left; font: 600 11.5px/1.2 var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px 8px 0; border-bottom: 1px solid var(--line2); }
table.t td { padding: 9px 8px 9px 0; border-bottom: 1px solid var(--line); } table.t .r { text-align: right; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .gl { stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 4; } .chart .band { fill: var(--acc-soft); }
.chart .ln { stroke: var(--chart); stroke-width: 2.8; fill: none; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1200; stroke-dashoffset: 1200; animation: draw 1.1s var(--ease) .1s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.chart .ar { fill: url(#wgrad); animation: fadeIn .8s .4s both; }
.chart .g0 { stop-color: var(--chart); stop-opacity: .26; } .chart .g1 { stop-color: var(--chart); stop-opacity: 0; }
@keyframes fadeIn { from { opacity: 0; } }
.chart .pt { fill: var(--glass2); stroke: var(--chart); stroke-width: 2.5; animation: popIn .4s var(--spring) .7s both; transform-box: fill-box; transform-origin: center; } .chart .pt.last { fill: var(--chart); stroke: #fff; stroke-width: 3; }
.chart .tag rect { fill: var(--fg); } .chart .tag text { fill: var(--glass2); font: 700 11px var(--f-body); }
.chart text { fill: var(--muted); font: 500 11px var(--f-body); font-variant-numeric: tabular-nums; }
.bignum { font: 800 46px/1 var(--f-display); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
.bignum small { font: 700 16px/1 var(--f-display); color: var(--muted); margin-left: 4px; letter-spacing: 0; }

/* ---------- illustrations ---------- */
.fig { width: 100%; height: auto; display: block; background: var(--stage); border-radius: 18px; }
.fig .fg { stroke: var(--fig); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig circle.fg, .fig ellipse.fg { fill: var(--fig); stroke: none; }
.fig .ff { stroke: var(--fig-far); fill: none; stroke-linecap: round; stroke-linejoin: round; }
.fig circle.ff { fill: var(--fig-far); stroke: none; }
.fig .fill { fill: var(--fig); }
.fig .w-arm { stroke-width: 8.5px; } .fig .w-leg { stroke-width: 11px; } .fig .w-foot { stroke-width: 6.5px; } .fig .w-arm-s { stroke-width: 5px; }
.fig .mat { fill: var(--mat); } .fig .wall { fill: var(--line2); }
.fig .fx-band, .fig .fx-line { stroke: var(--run); stroke-width: 3px; fill: none; stroke-linecap: round; }
.fig .inset-bg { fill: var(--glass2); stroke: var(--line2); } .fig .inset-t { fill: var(--muted); font: 500 9px var(--f-body); }
.stage { position: relative; border-radius: 24px; overflow: hidden; background: var(--stage); border: 1px solid var(--brd); box-shadow: var(--shadow); }
.stage .fig { border-radius: 0; margin-bottom: 50px; background: transparent; }
.stage-ctl { position: absolute; left: 8px; right: 8px; bottom: 8px; display: grid; grid-template-columns: 40px 1fr; gap: 10px; align-items: center; background: var(--glass2); border-radius: 999px; padding: 4px 14px 4px 4px; box-shadow: 0 6px 16px -8px rgba(0, 0, 0, .2); }
.stage-ctl .btn { width: 40px; min-height: 40px; border-radius: 50%; background: var(--acc-grad); color: #fff; box-shadow: none; }
.stage-ctl .btn svg { width: 15px; height: 15px; }
.stage-ctl input[type=range] { width: 100%; accent-color: var(--acc); height: 24px; margin: 0; }
.stage-lbl { position: absolute; left: 10px; top: 10px; right: 10px; display: flex; justify-content: space-between; gap: 8px; font-size: 12px; pointer-events: none; }
.stage-lbl b { color: var(--fg); font-weight: 600; background: var(--glass2); padding: 5px 10px; border-radius: 999px; box-shadow: 0 4px 12px -6px rgba(0, 0, 0, .18); }
.stage-lbl span { color: var(--muted); padding: 5px 0; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pair figure { margin: 0; display: flex; flex-direction: column; gap: 4px; }
.pair figcaption { font-size: 11.5px; color: var(--muted); text-align: center; font-weight: 600; }
.thumb { width: 74px; flex: none; } .thumb .fig { border-radius: 14px; }
.cues { display: grid; gap: 16px; }
.cues ol, .cues ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.cues h4 { margin: 0 0 6px; font: 700 14px/1.2 var(--f-display); color: var(--acc); }

/* ---------- barre d’onglets flottante ---------- */
#tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 30; max-width: 536px; margin: 0 auto; padding: 6px; border-radius: 26px;
  background: var(--bar); backdrop-filter: blur(18px) saturate(1.5); -webkit-backdrop-filter: blur(18px) saturate(1.5); border: 1px solid var(--brd); box-shadow: 0 18px 40px -16px rgba(18, 60, 50, .35); }
#tabs nav { display: grid; grid-template-columns: repeat(4, 1fr); position: relative; }
#tabs .ind { position: absolute; top: 0; bottom: 0; left: 0; width: 25%; padding: 0 3px; transition: transform .55s var(--spring); pointer-events: none; }
#tabs .ind::before { content: ''; display: block; height: 100%; border-radius: 20px; background: var(--acc-soft); }
#tabs a { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 52px; color: var(--muted); text-decoration: none; font: 600 11px/1 var(--f-body); transition: color .25s; }
#tabs a svg { width: 23px; height: 23px; transition: transform .45s var(--spring); }
#tabs a:active svg { transform: scale(.8); }
#tabs a[aria-current=page] { color: var(--acc); }

/* ---------- séance ---------- */
#session { position: fixed; inset: 0; z-index: 50; overflow-y: auto; overscroll-behavior: contain; animation: sheetUp .42s var(--ease); background: var(--page); }
#session::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none; background: radial-gradient(40% 25% at 100% 10%, var(--blob2), transparent 70%), radial-gradient(45% 30% at 0% 50%, var(--blob1), transparent 70%); }
#session.out { animation: sheetDown .26s var(--ease) forwards; }
@keyframes sheetUp { from { transform: translateY(48px); opacity: 0; } }
@keyframes sheetDown { to { transform: translateY(48px); opacity: 0; } }
.s-head { position: sticky; top: 0; z-index: 3; background: var(--shead); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 10px; box-shadow: 0 1px 0 var(--line); }
.s-head-in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: 46px 1fr 46px; gap: 8px; align-items: center; }
.s-title { text-align: center; min-width: 0; }
.s-title b { display: block; font: 800 17px/1.15 var(--f-display); letter-spacing: -.01em; }
.s-title span { font-size: 12px; color: var(--muted); }
.prog { max-width: 560px; margin: 9px auto 0; display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; }
.prog i { height: 5px; border-radius: 5px; background: var(--tint2); overflow: hidden; position: relative; }
.prog i::after { content: ''; position: absolute; inset: 0; background: var(--acc-grad); transform: scaleX(0); transform-origin: left; transition: transform .7s var(--ease); }
.prog i.done::after { transform: scaleX(1); }
.prog i.cur { background: var(--acc-line); }
.s-body { max-width: 560px; margin: 0 auto; padding: 16px 16px calc(170px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.s-body.enter-r { animation: enterR .34s var(--ease); } .s-body.enter-l { animation: enterL .34s var(--ease); } .s-body.enter { animation: enterU .34s var(--ease); }
.ex-title { font: 800 30px/1.05 var(--f-display); letter-spacing: -.03em; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 6px; font-size: 13.5px; color: var(--muted); align-items: center; }
.ex-meta > span { background: var(--glass); border: 1px solid var(--brd); padding: 6px 11px; border-radius: 999px; display: inline-flex; align-items: center; gap: 5px; }
.ex-meta b { color: var(--fg); font-weight: 700; }
.setrow { appearance: none; border: 1px solid var(--brd); display: grid; grid-template-columns: 32px 1fr auto; gap: 10px; align-items: center; min-height: 58px; padding: 8px 14px; border-radius: 18px; background: var(--glass); box-shadow: var(--shadow); width: 100%; text-align: left; transition: transform .4s var(--spring); color: var(--fg); }
.setrow:active { transform: scale(.98); }
.setrow .no { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font: 800 14px/1 var(--f-display); color: var(--muted); background: var(--tint2); }
.setrow .v { font: 800 24px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.setrow .v small { font: 500 13px var(--f-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.setrow .ck { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--acc-grad); color: #fff; box-shadow: 0 6px 14px -6px var(--acc-glow); }
.setrow .ck svg { width: 16px; height: 16px; }
.setrow.done .no { color: var(--acc); background: var(--acc-soft); }
.setrow.todo { background: transparent; box-shadow: none; border: 1.5px dashed var(--line2); }
.setrow.todo .v { font: 500 15px var(--f-body); color: var(--dim); }
.setrow.fresh { animation: fresh .8s var(--ease); }
.setrow.fresh .ck { animation: popIn .55s var(--spring) .05s both; }
@keyframes fresh { 0% { background: var(--acc-soft); transform: scale(.96); } 100% { transform: none; } }
.seteditor { border-radius: 26px; background: var(--glass); border: 1px solid var(--brd); box-shadow: var(--shadow), inset 0 0 0 1.5px var(--acc-line); padding: 14px; display: flex; flex-direction: column; gap: 12px; animation: rise .4s var(--ease); }
.seteditor .lbl { font: 700 13px/1 var(--f-body); color: var(--acc); }
.ex-nav { display: grid; grid-template-columns: 1fr 1.7fr; gap: 8px; }
.info { appearance: none; border: 0; background: var(--tint2); color: var(--muted); width: 22px; height: 22px; border-radius: 50%; display: inline-grid; place-items: center; padding: 0; transition: transform .4s var(--spring); }
.info:active { transform: scale(.85); }
.info svg { width: 13px; height: 13px; }
.check-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.check-list button { appearance: none; border: 1px solid var(--brd); width: 100%; display: grid; grid-template-columns: 26px 1fr; gap: 12px; align-items: center; text-align: left; background: var(--glass); box-shadow: var(--shadow); border-radius: 18px; padding: 12px 14px; min-height: 56px; font-size: 14.5px; transition: transform .4s var(--spring), background-color .25s; color: var(--fg); }
.check-list button:active { transform: scale(.98); }
.check-list .cb { width: 26px; height: 26px; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--line2); display: grid; place-items: center; transition: background-color .25s, box-shadow .25s; }
.check-list .cb svg { width: 14px; height: 14px; opacity: 0; transform: scale(.4); transition: opacity .2s, transform .4s var(--spring); }
.check-list button.on .cb { background: var(--acc-grad); box-shadow: none; color: #fff; }
.check-list button.on .cb svg { opacity: 1; transform: none; }
.check-list button.on { color: var(--muted); }

/* minuteur de repos */
#restbar { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 60; max-width: 540px; margin: 0 auto; padding: 12px; border-radius: 28px; background: var(--rest); border: 1px solid var(--brd); box-shadow: 0 20px 44px -16px rgba(18, 60, 50, .45); animation: barUp .45s var(--spring); }
@keyframes barUp { from { transform: translateY(120%); } }
.rb-in { display: grid; grid-template-columns: 72px 1fr; gap: 12px; align-items: center; }
.ring { position: relative; width: 72px; height: 72px; }
.ring svg { width: 72px; height: 72px; transform: rotate(-90deg); display: block; }
.ring circle { fill: none; stroke-width: 7; }
.ring .bgc { stroke: var(--tint2); } .ring .fgc { stroke: var(--acc); stroke-linecap: round; transition: stroke-dashoffset .3s linear; }
.ring .tt { position: absolute; inset: 0; display: grid; place-items: center; font: 800 19px/1 var(--f-display); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.ring.done { animation: ringPulse 1.1s var(--ease) 3; } .ring.done .tt { color: var(--acc); }
@keyframes ringPulse { 50% { transform: scale(1.07); } }
.rb-main { min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.rb-top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.rb-lbl { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.rb-lbl b { color: var(--fg); }
.rb-pre { display: flex; gap: 4px; flex: none; }
.rb-pre .chip { min-height: 30px; min-width: 0; padding: 4px 9px; font-size: 12.5px; border-radius: 999px; }
.rb-ctl { display: grid; grid-template-columns: 1fr 1fr 1fr 1.4fr; gap: 6px; }
.rb-ctl .btn { min-height: 42px; padding: 6px; font-size: 14px; border-radius: 999px; }
.pause-veil { position: fixed; inset: 0; z-index: 70; background: var(--veil); display: flex; align-items: center; justify-content: center; padding: 24px; animation: fadeIn .25s; }
.pause-veil .box { max-width: 340px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 14px; animation: rise .4s var(--ease); }
.pause-veil .box b { font: 800 44px/1 var(--f-display); letter-spacing: -.03em; }

/* célébration */
#celebrate { position: fixed; inset: 0; z-index: 95; display: grid; place-items: center; padding: 24px; background: radial-gradient(60% 45% at 50% 40%, var(--acc-soft), transparent 70%), var(--veil); animation: fadeIn .3s; }
#celebrate.out { animation: fadeOut .3s forwards; }
@keyframes fadeOut { to { opacity: 0; } }
.cel { position: relative; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 360px; width: 100%; }
.cel-ring { position: relative; width: 136px; height: 136px; }
.cel-ring svg { width: 136px; height: 136px; overflow: visible; }
.cel-ring .c { fill: none; stroke: var(--acc); stroke-width: 8; stroke-linecap: round; stroke-dasharray: 380; stroke-dashoffset: 380; transform: rotate(-90deg); transform-origin: 50% 50%; animation: draw .8s var(--ease) .1s forwards; }
.cel-ring .k { fill: none; stroke: var(--acc); stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 90; stroke-dashoffset: 90; animation: draw .45s var(--ease) .75s forwards; }
.burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.burst i { position: absolute; width: 9px; height: 9px; margin: -4.5px; border-radius: 50%; background: var(--acc); opacity: 0; animation: burst .95s var(--ease) .8s forwards; }
.burst i:nth-child(3n) { background: var(--run); width: 7px; height: 7px; } .burst i:nth-child(4n) { background: #E8A33D; }
@keyframes burst { 0% { opacity: 1; transform: rotate(var(--a)) translateY(-52px) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(-128px) scale(.3); } }
.cel h2 { font: 800 38px/1.02 var(--f-display); letter-spacing: -.03em; animation: rise .5s var(--ease) .9s both; }
.cel .meta { justify-content: center; animation: rise .5s var(--ease) 1s both; gap: 6px 20px; }
.cel .btn { animation: rise .5s var(--ease) 1.1s both; min-width: 220px; }

/* feuille modale */
#sheet { position: fixed; inset: 0; z-index: 80; display: flex; align-items: flex-end; justify-content: center; }
.sh-back { position: absolute; inset: 0; background: var(--overlay); animation: fadeIn .25s; }
.sh-panel { position: relative; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; overscroll-behavior: contain; background: var(--sheet); border-radius: 30px 30px 0 0;
  padding: 10px 16px calc(22px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: panelUp .46s var(--ease); box-shadow: 0 -20px 60px rgba(10, 40, 34, .25); }
@supports (max-height: 1dvh) { .sh-panel { max-height: 92dvh; } }
.sh-panel > * { flex-shrink: 0; }
@keyframes panelUp { from { transform: translateY(100%); } }
#sheet.swap .sh-panel, #sheet.swap .sh-back { animation: none; }
#sheet.swap .sh-panel > * { animation: rise .32s var(--ease) both; }
#sheet.out .sh-panel { animation: panelDown .26s var(--ease) forwards; } #sheet.out .sh-back { animation: fadeOut .26s forwards; }
@keyframes panelDown { to { transform: translateY(100%); } }
.sh-grab { width: 42px; height: 5px; border-radius: 5px; background: var(--line2); margin: 0 auto 2px; }
.sh-head { display: grid; grid-template-columns: 1fr 44px; gap: 10px; align-items: start; }
.sh-head h2 { font: 800 25px/1.08 var(--f-display); letter-spacing: -.03em; }
.sh-head .btn.icon { width: 44px; min-height: 44px; }
.sh-panel .card, .sh-panel .group { box-shadow: none; }

#toast { position: fixed; left: 50%; bottom: calc(var(--tab-h) + 30px + env(safe-area-inset-bottom, 0px)); z-index: 90; background: var(--toast-bg); color: var(--toast-fg); padding: 12px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; max-width: calc(100% - 32px); width: max-content; box-shadow: 0 14px 40px rgba(10, 40, 34, .3); transform: translateX(-50%); animation: toastIn .5s var(--spring); display: flex; gap: 8px; align-items: center; }
#toast svg { width: 18px; height: 18px; color: #3DDDA8; flex: none; }
#toast.out { animation: toastOut .25s var(--ease) forwards; }
@keyframes toastIn { from { transform: translate(-50%, 20px) scale(.9); opacity: 0; } }
@keyframes toastOut { to { transform: translate(-50%, 12px); opacity: 0; } }
body.insession #toast { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* ---------- vue d’impression ---------- */
#print { background: #fff; color: #121616; min-height: 100vh; position: relative; z-index: 1; }
.pr-bar { position: sticky; top: 0; z-index: 2; background: #EEF3F1; border-bottom: 1px solid #D5DEDB; padding: 10px 16px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.pr-bar .btn { background: #fff; color: #121616; box-shadow: inset 0 0 0 1px #C9D3D0; }
.pr-bar .btn.primary { background: #0B7D50; color: #fff; box-shadow: none; }
.pr-bar p { font-size: 13px; color: #44514E; flex: 1 1 260px; }
.pr { max-width: 820px; margin: 0 auto; padding: 24px 18px 60px; font: 400 12.5px/1.45 var(--f-body); }
.pr h1 { font: 800 30px/1.05 var(--f-display); letter-spacing: -.02em; }
.pr h2 { font: 800 19px/1.1 var(--f-display); letter-spacing: -.01em; margin: 22px 0 8px; padding-bottom: 4px; border-bottom: 2px solid #121616; break-after: avoid; }
.pr h3 { font: 700 14.5px/1.15 var(--f-display); margin: 0 0 4px; }
.pr p, .pr li { color: #222a29; }
.pr .lead { font-size: 13.5px; color: #3A4644; margin-top: 6px; }
.pr .warnbox { border: 1px solid #C99A2E; background: #FFF7E3; border-radius: 8px; padding: 8px 10px; margin-top: 10px; font-size: 12px; }
.pr .tw { overflow-x: auto; }
.pr table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.pr th, .pr td { border: 1px solid #C5CFCC; padding: 4px 6px; text-align: left; vertical-align: top; font-size: 11.5px; }
.pr th { background: #EEF3F1; font-weight: 700; }
.pr tr { break-inside: avoid; }
.pr .cal td.s { background: #E4F5EE; font-weight: 600; } .pr .cal td.c { background: #FDEDE6; }
.pr .exs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pr .exc { border: 1px solid #C5CFCC; border-radius: 10px; padding: 10px; break-inside: avoid; display: flex; flex-direction: column; gap: 6px; }
.pr .exc .pair figcaption { color: #44514E; }
.pr .exc ol, .pr .exc ul { margin: 0; padding-left: 16px; }
.pr .exc .k { font-weight: 700; }
.pr .fig { background: #F2F6F4; --fig: #18201F; --fig-far: #8D9B98; --mat: #D5DDDA; --run: #C9573A; --line2: #C5CFCC; --glass2: #fff; --muted: #44514E; }
.pr .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pr .box { border: 1px solid #C5CFCC; border-radius: 10px; padding: 10px; break-inside: avoid; }
.pr .blank td { height: 22px; }
.pr .meta { color: #5A6764; font-size: 11px; display: block; }
@media (max-width: 520px) { .pr .exs, .pr .cols { grid-template-columns: 1fr; } }
@media (max-width: 380px) { .hero-name { font-size: 30px; } .title-xl { font-size: 27px; } .ex-title { font-size: 27px; } .wring { grid-template-columns: 96px 1fr; } .wring .rg, .wring svg { width: 96px; height: 96px; } }
@media print {
  @page { size: A4; margin: 12mm; }
  html, body { background: #fff !important; }
  body::before { display: none; }
  #app, #tabs, #session, #sheet, #toast, #restbar, #celebrate, .pr-bar { display: none !important; }
  #print { min-height: 0; }
  .pr { max-width: none; padding: 0; font-size: 10.5pt; }
  .pr .exs, .pr .cols { grid-template-columns: 1fr 1fr; }
  .pr .pb { break-before: page; }
  .pr .cols.pb > div > h2 { margin-top: 0; }
  .pr .exc { font-size: 9.5pt; line-height: 1.38; }
  .pr .tw { overflow: visible; }
  .pr .fig, .pr th, .pr .cal td.s, .pr .cal td.c, .pr .warnbox { -webkit-print-color-adjust: exact; print-color-adjust: exact; }

<script>
/* ===== Silhouette articulée : cinématique simple (2 segments par membre) ===== */
const FIG = (() => {
  const L = { torso: 50, neck: 14, head: 10.5, ua: 28, fa: 26, th: 42, sh: 40, foot: 15 };
  const R = Math.PI / 180;
  const dir = (a, l = 1) => [Math.cos(a * R) * l, Math.sin(a * R) * l];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const mul = (v, k) => [v[0] * k, v[1] * k];
  const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / R;
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const lerp = (a, b, t) => a + (b - a) * t;
  const lp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const ease = t => 0.5 - Math.cos(Math.PI * t) / 2;

  function ik(root, target, l1, l2, bend) {
    let d = dist(root, target);
    const base = ang(root, target);
    d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, d));
    const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const a = Math.acos(Math.max(-1, Math.min(1, c))) / R;
    const j = add(root, dir(base + bend * a, l1));
    const e = add(j, dir(ang(j, target), l2));
    return [root, j, e];
  }
  function chain(root, s, l1, l2) {
    const k1 = s.s1 ?? 1, k2 = s.s2 ?? 1;
    if (s.ik) return ik(root, s.ik, l1 * k1, l2 * k2, s.bend ?? 1);
    const j = add(root, dir(s.a[0], l1 * k1));
    return [root, j, add(j, dir(s.a[1], l2 * k2))];
  }
  function solve(p) {
    const hip = p.hip;
    const S = p.shoulder || add(hip, dir(p.torso, L.torso));
    const tA = p.shoulder ? ang(hip, S) : p.torso;
    const n = dir(tA + 90);
    const sw = (p.sw ?? 3) / 2, hw = (p.hw ?? 3) / 2;
    const sN = add(S, mul(n, sw)), sF = add(S, mul(n, -sw));
    const hN = add(hip, mul(n, hw)), hF = add(hip, mul(n, -hw));
    const head = add(S, dir(p.headAbs ?? (tA + (p.headTilt || 0)), L.neck));
    const o = { hip, S, sN, sF, hN, hF, head, tA };
    o.armN = chain(sN, p.armN, L.ua, L.fa);
    o.armF = chain(sF, p.armF || p.armN, L.ua, L.fa);
    o.legN = chain(hN, p.legN, L.th, L.sh);
    o.legF = chain(hF, p.legF || p.legN, L.th, L.sh);
    const foot = (leg, a, k) => { const an = leg[2]; return [add(an, dir(a + 180, 4 * k)), add(an, dir(a, L.foot * k))]; };
    o.footN = foot(o.legN, p.footN ?? 0, p.footS ?? 1);
    o.footF = foot(o.legF, p.footF ?? p.footN ?? 0, p.footS ?? 1);
    return o;
  }
  const P = pts => pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');

  // ordre de dessin (arrière -> avant)
  function parts(p, o, ex) {
    const front = !!p.front;
    const far = front ? 'fg' : 'ff';
    const list = [
      { k: 'bx', t: 'path', c: 'fx-band', d: '' },
      { k: 'armF', t: 'path', c: far + ' w-arm', d: P(o.armF) },
      { k: 'legF', t: 'path', c: far + ' w-leg', d: P(o.legF) },
      { k: 'footF', t: 'path', c: far + ' w-foot', d: P(o.footF) },
      { k: 'handF', t: 'circle', c: far, cx: o.armF[2][0], cy: o.armF[2][1], r: p.handR ?? 4 },
      { k: 'torso', t: 'path', c: 'fg fill', d: P([o.sN, o.sF, o.hF, o.hN]) + ' Z', sw: p.torsoW ?? 17 },
      { k: 'head', t: 'circle', c: 'fg', cx: o.head[0], cy: o.head[1], r: L.head },
      { k: 'legN', t: 'path', c: 'fg w-leg', d: P(o.legN) },
      { k: 'footN', t: 'path', c: 'fg w-foot', d: P(o.footN) },
      { k: 'armN', t: 'path', c: 'fg w-arm', d: P(o.armN) },
      { k: 'handN', t: 'circle', c: 'fg', cx: o.armN[2][0], cy: o.armN[2][1], r: p.handR ?? 4 },
      { k: 'fx', t: 'path', c: 'fx-band', d: '' },
      { k: 'fx2', t: 'path', c: 'fx-line', d: '' }
    ];
    if (ex.extras) {
      const e = ex.extras(o, p) || {};
      for (const it of list) if (e[it.k] != null) it.d = e[it.k];
    }
    return list;
  }

  const VB = '0 0 320 190';
  function bg(ex) {
    let s = '<rect class="mat" x="18" y="172" width="284" height="7" rx="3.5"></rect>';
    if (ex.wall) s += '<rect class="wall" x="' + ex.wall + '" y="10" width="8" height="162"></rect>';
    if (ex.bgx) s += ex.bgx;
    return s;
  }
  function el(it) {
    if (it.t === 'circle') return '<circle data-p="' + it.k + '" class="' + it.c + '" cx="' + it.cx.toFixed(1) + '" cy="' + it.cy.toFixed(1) + '" r="' + it.r + '"></circle>';
    return '<path data-p="' + it.k + '" class="' + it.c + '" d="' + it.d + '"' + (it.sw ? ' style="stroke-width:' + it.sw + 'px"' : '') + '></path>';
  }
  function svg(ex, t = 0, side = 1, extraCls = '') {
    const p = ex.pose(t, side);
    const o = solve(p);
    const inset = ex.inset ? '<g data-inset>' + ex.inset(t, side) + '</g>' : '';
    return '<svg class="fig ' + extraCls + '" viewBox="' + VB + '" role="img" aria-label="' + ex.name + '">' + bg(ex) + parts(p, o, ex).map(el).join('') + inset + '</svg>';
  }
  function update(svgEl, ex, t, side) {
    const p = ex.pose(t, side), o = solve(p);
    for (const it of parts(p, o, ex)) {
      const n = svgEl.querySelector('[data-p="' + it.k + '"]');
      if (!n) continue;
      if (it.t === 'circle') { n.setAttribute('cx', it.cx.toFixed(1)); n.setAttribute('cy', it.cy.toFixed(1)); }
      else n.setAttribute('d', it.d);
    }
    if (ex.inset) { const g = svgEl.querySelector('[data-inset]'); if (g) g.innerHTML = ex.inset(t, side); }
  }

  // Lecture d'une séquence : [{to, dur, label, side}, {hold, label}]
  function sample(seq, ms) {
    const total = seq.reduce((a, s) => a + (s.dur || s.hold || 0), 0);
    let tm = ((ms % total) + total) % total, cur = 0, side = 1;
    for (const s of seq) {
      if (s.side) side = s.side;
      const d = s.dur || s.hold;
      if (tm <= d) {
        if (s.hold) return { t: cur, side, label: s.label, total };
        const t = lerp(cur, s.to, ease(tm / d));
        return { t, side, label: s.label, total };
      }
      tm -= d;
      if (!s.hold) cur = s.to;
    }
    return { t: cur, side, label: '', total };
  }

  return { L, dir, add, mul, ang, dist, lerp, lp, ease, solve, svg, update, sample, P };
})();

function artSVG(kind) { return kind === 'run' ? FIG.svg(RUNNER, 0, 1) : FIG.svg(EX[kind], 1, 1); }
const ART = { A: 'squat', B: 'row_band' };
function scrToday() {

function doneSetsCount(s) { return s.ex.reduce((a, e) => a + e.sets.length, 0); }
function startHero() {

}
function startPicker() {
  const cur = S.plan.startDate, first = nextMonday(today());

    '<label class="field"><span>Autre date</span><input class="input" type="date" id="startInput" value="' + (cur || '') + '"></label></div>';

function beforeHero(ci) {

    '<div class="btns"><button class="btn pill" data-act="previewKind" data-kind="A" data-pw="1">Découvrir la séance A</button></div></section>';
}
function afterHero() {

}
function dayHero(ci) {

    const s = S.sessions[ci.date];

        '<button class="btn pill block" data-act="viewSession" data-date="' + s.date + '">Voir le résumé</button></section>';
    }
    const wk = WEEKS[ci.pw - 1];
    return '<section class="hero"><div class="hero-grid"><div><span class="pill acc" style="align-self:flex-start">Musculation · ' + (ci.k + 1) + '/3</span><div class="hero-name">Séance ' + ci.kind + '</div>' +
      '<div class="meta"><span><b>' + SESSIONS[ci.kind].length + '</b>exercices</span><span><b>' + wk.setsMain + '</b>séries</span><span><b>' + estMinutes(ci.kind, ci.pw, false) + '</b>min</span></div></div><div class="hero-art">' + artSVG(ART[ci.kind]) + '</div></div>' +
      '<button class="btn primary xl block shine" data-act="startSession" data-date="' + ci.date + '">' + I.play + 'Démarrer la séance</button>' +
      '<div class="hero-foot"><label class="toggle" style="min-height:40px;gap:10px"><input type="checkbox" class="sw" id="reducedToggle"><span class="small">Version allégée</span></label><button class="linkbtn" data-act="previewKind" data-kind="' + ci.kind + '" data-pw="' + ci.pw + '" data-date="' + ci.date + '">Exercices' + I.fwd + '</button></div></section>';

      '<button class="btn pill block" data-act="mobSheet" data-date="' + ci.date + '">' + (done ? I.check + 'Mobilité faite' : I.leaf + 'Voir la mobilité douce') + '</button></section>';

function runHero(ci) {

function weekStats(ci) {
  const ws = weekStart(ci.idx); let sd = 0, rd = 0;
  for (let d = 0; d < 7; d++) { const date = addD(ws, d); if (S.sessions[date] && S.sessions[date].status === 'done') sd++; const r = S.runs[date]; if (r && r.kind !== 'skipped') rd++; }
  const wN = S.weights.filter(w => w.date >= ws && w.date <= addD(ws, 6)).length;
  return { ws, sd: Math.min(sd, 3), rd: Math.min(rd, 2), wN, sh: shakeDaysInWeek(ws) };
}
function weekRingCard(ci) {

    '<div class="legend"><div><i></i><span>Séances</span><b>' + st.sd + '/3</b></div><div><i class="c"></i><span>Footings</span><b>' + st.rd + '/2</b></div><div><i class="y"></i><span>Pesées</span><b>' + st.wN + '/3</b></div><div><i class="p"></i><span>Shakers</span><b>' + st.sh + '/7</b></div></div></div></section>';

function activityCard(ci) {

function upcoming(t) {
  const rows = [];
  for (let i = 1; i <= 3; i++) {
    const d = addD(t, i), ci = calInfo(d);

    if (ci.before) continue;
    rows.push('<div class="li"><div><div class="t">' + (i === 1 ? 'Demain' : fmtDL(d)) + '</div><div class="s">' + dayText(ci) + '</div></div>' + kindPill(ci) + '</div>');

function dayText(ci) {

}
function kindPill(ci) {
  if (ci.type === 'strength') return pill(ci.kind, 'acc');

  return '';

/* ---------- Programme ---------- */

    '<div class="row" style="gap:6px"><button class="btn icon sm" data-act="selWeek" data-i="' + Math.max(0, i - 1) + '" aria-label="Semaine précédente"' + (i === 0 ? ' disabled' : '') + '>' + I.back + '</button><button class="btn icon sm" data-act="selWeek" data-i="' + Math.min(S.plan.seq.length - 1, i + 1) + '" aria-label="Semaine suivante"' + (i === S.plan.seq.length - 1 ? ' disabled' : '') + '>' + I.fwd + '</button></div></div>';
  h += '<div class="mini3"><div><b>' + wk.setsMain + '</b><span>séries principaux</span></div><div><b>' + wk.setsComp + '</b><span>séries complém.</span></div><div><b>' + rirLabel(wk.rir[0], wk.rir[1]) + '</b><span>en réserve</span></div></div>';

    } else if (ci.type === 'run') {
      main = 'Footing ' + ci.planned + ' min';

/* ---------- feuilles ---------- */
let sheetTimer = null;
function openSheet(html, fn) {
  const el = document.getElementById('sheet');
  clearTimeout(sheetTimer);
  const swap = !el.hidden && !el.classList.contains('out');
  el.classList.remove('out'); el.classList.toggle('swap', swap);
  const prevScroll = swap && fn && ui.sheetFn === fn ? (el.querySelector('.sh-panel') || {}).scrollTop : 0;
  el.querySelectorAll('.stage').forEach(s => s._st && s._st.stop());
  el.innerHTML = '<div class="sh-back" data-act="closeSheet"></div><div class="sh-panel" role="dialog" aria-modal="true"><div class="sh-grab"></div>' + html + '</div>';
  el.hidden = false; document.body.classList.add('noscroll');
  ui.sheetFn = fn || null;
  mountStages(el);
  const p = el.querySelector('.sh-panel'); if (p && prevScroll) p.scrollTop = prevScroll;
}
function refreshSheet() { const el = document.getElementById('sheet'); if (!el.hidden && ui.sheetFn) { const f = ui.sheetFn; openSheet(f(), f); el.classList.add('swap'); el.querySelectorAll('.sh-panel > *').forEach(x => x.style.animation = 'none'); } }

function weightChart() {
  const ws = weeklyWeights();
  if (ws.length < 2) return '<p class="note">Le graphique apparaît dès deux semaines de pesées.</p>';
  const W = 320, H = 150, L = 34, Rr = 10, T = 26, B = 24;
  const first = ws[0].week, span = Math.max(1, diffD(first, ws[ws.length - 1].week) / 7);
  const g = S.profile, gl = g.gainLowG / 1000, gh = g.gainHighG / 1000;
  const vals = ws.map(w => w.avg).concat([ws[0].avg + gh * span]);
  let lo = Math.min(...vals) - 0.3, hi = Math.max(...vals) + 0.3;
  if (hi - lo < 1.2) { const m = (hi + lo) / 2; lo = m - 0.6; hi = m + 0.6; }
  const x = w => L + (diffD(first, w) / 7) / span * (W - L - Rr);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const x0 = x(first), xN = x(ws[ws.length - 1].week), y0 = ws[0].avg;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Moyennes hebdomadaires du poids"><defs><linearGradient id="wgrad" x1="0" x2="0" y1="0" y2="1"><stop class="g0" offset="0"/><stop class="g1" offset="1"/></linearGradient></defs>';
  [lo + 0.15 * (hi - lo), (lo + hi) / 2, hi - 0.15 * (hi - lo)].forEach(v => { s += '<line class="gl" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"></line><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + num(v, 1) + '</text>'; });
  s += '<polygon class="band" points="' + x0 + ',' + y(y0) + ' ' + xN + ',' + y(y0 + gh * span) + ' ' + xN + ',' + y(y0 + gl * span) + '"></polygon>';
  const pts = ws.map(w => [x(w.week), y(w.avg)]);
  const d = pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L');
  s += '<path class="ar" d="M' + d + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - B) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - B) + ' Z"></path><path class="ln" d="M' + d + '"></path>';
  pts.forEach((p, i) => { s += '<circle class="pt' + (i === pts.length - 1 ? ' last' : '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (ws[i].n >= 2 ? 4.5 : 3) + '"></circle>'; });
  const lp = pts[pts.length - 1], lab = num(ws[ws.length - 1].avg, 1), tw = lab.length * 6.4 + 12, tx = Math.min(W - tw - 2, Math.max(L, lp[0] - tw / 2)), ty = Math.max(0, lp[1] - 30);
  s += '<g class="tag"><rect x="' + tx.toFixed(1) + '" y="' + ty.toFixed(1) + '" width="' + tw.toFixed(1) + '" height="19" rx="9.5"></rect><text x="' + (tx + tw / 2).toFixed(1) + '" y="' + (ty + 13).toFixed(1) + '" text-anchor="middle">' + lab + '</text></g>';
  s += '<text x="' + x0 + '" y="' + (H - 6) + '">' + fmtShort(first) + '</text><text x="' + xN + '" y="' + (H - 6) + '" text-anchor="end">' + fmtShort(ws[ws.length - 1].week) + '</text></svg>';
  return '<div class="chart">' + s + '</div><p class="note">Moyennes par semaine. Zone verte : repère ' + g.gainLowG + '–' + g.gainHighG + ' g/sem., sans promesse.</p>';
}

const ROUTES = { today: scrToday, program: scrProgram, progress: scrProgress, profile: scrProfile };
const ORDER = ['today', 'program', 'progress', 'profile'];
let route = 'today', prevRoute = null;
function readRoute() { const h = (location.hash || '').replace('#', ''); return (ROUTES[h] || h === 'print') ? h : 'today'; }
function render(opts = {}) {
  const app = document.getElementById('app'), pr = document.getElementById('print'), tabs = document.getElementById('tabs');
  if (route === 'print') { app.hidden = true; tabs.hidden = true; pr.hidden = false; renderPrint(); window.scrollTo(0, 0); prevRoute = route; return; }
  pr.hidden = true; pr.innerHTML = ''; app.hidden = false; tabs.hidden = false;
  const changed = prevRoute !== route;
  ANIM = changed || !!opts.anim;
  preserveStages(app);
  app.innerHTML = ROUTES[route]();
  restoreStages(app);
  const scr = app.firstElementChild;
  if (changed && scr && !RM()) scr.classList.add(prevRoute == null || prevRoute === 'print' ? 'enter' : ORDER.indexOf(route) > ORDER.indexOf(prevRoute) ? 'enter-r' : 'enter-l');
  const anim = ANIM;
  app.querySelectorAll('.wring .f').forEach(c => { if (anim && !RM()) requestAnimationFrame(() => requestAnimationFrame(() => c.style.strokeDashoffset = c.dataset.off)); else { c.style.transition = 'none'; c.style.strokeDashoffset = c.dataset.off; } });
  prevRoute = route; ANIM = false;
  const idx = ORDER.indexOf(route), ind = tabs.querySelector('.ind');
  if (ind) ind.style.transform = 'translateX(' + (idx * 100) + '%)';
  tabs.querySelectorAll('a').forEach(a => a.getAttribute('href') === '#' + route ? a.setAttribute('aria-current', 'page') : a.removeAttribute('aria-current'));
}
function rerender() { render(); refreshSheet(); }
window.addEventListener('hashchange', () => { const r = readRoute(); if (r !== route) { route = r; ui.week = null; closeSheet(true); render(); window.scrollTo(0, 0); } });

function setPath(path, val) { const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function getPath(path) { return path.split('.').reduce((o, k) => o && o[k], S); }

function exportPayload() { return JSON.stringify({ app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data: { ...S, timer: null, stopwatch: null } }, null, 1); }
function validateImport(txt) {
  let o;
  try { o = JSON.parse(txt); } catch (e) { return { ok: false, errors: ['Ce n’est pas un fichier JSON lisible.'] }; }
  const errors = [];
  if (!isObj(o)) errors.push('Contenu inattendu.');
  else {
    if (o.app !== APP_ID) errors.push('Ce fichier ne vient pas de cette application.');
    if (o.schema !== SCHEMA) errors.push('Version de sauvegarde non reconnue.');
    const d = o.data;
    if (!isObj(d)) errors.push('Données absentes.');
    else {
      if (!isObj(d.profile) || !isObj(d.plan)) errors.push('Profil ou programme manquant.');
      if (d.plan && d.plan.startDate != null && !isDate(d.plan.startDate)) errors.push('Date de départ invalide.');
      if (d.weights && !Array.isArray(d.weights)) errors.push('Pesées illisibles.');
      for (const k of ['sessions', 'runs', 'shakes']) if (d[k] && !isObj(d[k])) errors.push('Rubrique « ' + k + ' » illisible.');
    }
  }
  if (errors.length) return { ok: false, errors };
  const n = normalize(o.data);
  const sum = plural(Object.keys(n.sessions).length, 'séance') + ', ' + plural(Object.keys(n.runs).length, 'sortie') + ', ' + plural(n.weights.length, 'pesée') + (n.plan.startDate ? ', départ le ' + fmtD(n.plan.startDate) : '');
  return { ok: true, data: n, sum, when: o.exportedAt ? new Date(o.exportedAt).toLocaleString('fr-FR', { dateStyle: 'short', timeStyle: 'short' }) : 'date inconnue' };
}
function addWeight(date, val) {
  const kg = Math.round(parseFloat(String(val).replace(',', '.')) * 10) / 10;
  if (!isDate(date) || !(kg >= 30 && kg <= 200)) { toast('Indique un poids entre 30 et 200 kg.'); return false; }
  if (date > today()) { toast('La date ne peut pas être dans le futur.'); return false; }
  S.weights = S.weights.filter(w => w.date !== date).concat({ date, kg });
  save(); haptic(12); toast('Pesée du ' + fmtD(date) + ' : ' + num(kg, 1) + ' kg'); return true;
}
function setStart(v) {
  if (!isDate(v)) return;
  const m = nextMonday(v);
  S.plan.startDate = m; ui.week = null; save(); rerender();
  toast(m === v ? 'Départ le ' + fmtDl(m) : 'Départ calé au lundi ' + fmtD(m));
}

  importApply() { const v = ui.importPreview; if (!v || !v.ok) return; backupNow(); S = v.data; applyTheme(); S.active = S.active && S.sessions[S.active]?.status === 'active' ? S.active : null; S.timer = null; ui.importPreview = null; ui.exportText = null; save(); closeSheet(); render(); toast('Données restaurées.'); },
  importCancel() { ui.importPreview = null; refreshSheet(); },
  restoreBackup() { let bk = null; try { bk = JSON.parse(localStorage.getItem(BKEY) || 'null'); } catch (e) { } if (!bk) return; const cur = S; S = normalize(bk.data); try { localStorage.setItem(BKEY, JSON.stringify({ at: new Date().toISOString(), data: cur })); } catch (e) { } save(); rerender(); toast('Copie de sécurité restaurée.'); },
  persist() { navigator.storage.persist().then(ok => toast(ok ? 'Stockage durable accordé.' : 'Stockage durable refusé : exporte régulièrement.')).catch(() => toast('Demande impossible ici.')); },
  resetAsk() { ui.confirmReset = true; refreshSheet(); },
  resetCancel() { ui.confirmReset = false; refreshSheet(); },
  resetDo() { backupNow(); S = defaults(); ui.confirmReset = false; ui.sess = false; save(); closeSheet(true); renderSession(); render(); toast('Données effacées. Copie de sécurité conservée.'); },
  install() { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; rerender(); }); },
  doPrint() { try { window.print(); } catch (e) { toast('Impression indisponible ici.'); } },
  ...SACT
};
function captureRunForm() {
  const f = ui.runForm && ui.runForm.f; if (!f) return;
  const m = document.getElementById('rfMinutes'), k = document.getElementById('rfKm'), n = document.getElementById('rfNote');
  if (m) f.minutes = m.value; if (k) f.km = k.value; if (n) f.note = n.value;
}

/* ---- retours tactiles : onde, ressort, vibration légère ---- */
const RIPPLE = '.btn, .chip, .seg button, .day, .wk, .setrow, .listrow, button.li, .footline, .check-list button';
document.addEventListener('pointerdown', e => {
  const el = e.target.closest(RIPPLE);
  if (!el || el.disabled || RM()) return;
  const r = el.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2.4;
  const s = document.createElement('span'); s.className = 'rip';
  s.style.width = s.style.height = d + 'px'; s.style.left = (e.clientX - r.left - d / 2) + 'px'; s.style.top = (e.clientY - r.top - d / 2) + 'px';
  el.appendChild(s); setTimeout(() => s.remove(), 650);
}, { passive: true });
const POP = new Set(['rir', 'fatigue', 'pain', 'painWhere', 'rf', 'rfFlag', 'selWeek', 'tech', 'variant', 'setPtab', 'tPreset', 'setStart']);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  unlockAudio();
  if (!el || el.disabled) return;
  const a = el.dataset.act, f = ACT[a];
  if (!f) return;
  if (el.tagName === 'BUTTON' || el.tagName === 'DIV') e.preventDefault();
  if (el.matches('.chip, .seg button, .wk') && !['rir', 'rfMin'].includes(a)) haptic(5);
  f(el, e);
  if (POP.has(a) && !el.isConnected && !RM()) {
    const sel = '[data-act="' + a + '"]' + ['v', 'k', 'i', 'id'].filter(k => el.dataset[k] != null).map(k => '[data-' + k + '="' + CSS.escape(el.dataset[k]) + '"]').join('');
    const n = document.querySelector(sel); if (n) n.classList.add('pop');
  }
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.chg;
  if (el.id === 'startInput') { setStart(el.value); return; }
  if (el.id === 'importFile') {
    const file = el.files && el.files[0]; if (!file) return;
    if (file.size > 5e6) { ui.importPreview = { ok: false, errors: ['Fichier trop volumineux pour une sauvegarde de cette application.'] }; refreshSheet(); return; }
    const rd = new FileReader(); rd.onload = () => { ui.importPreview = validateImport(String(rd.result)); refreshSheet(); }; rd.onerror = () => { ui.importPreview = { ok: false, errors: ['Lecture du fichier impossible.'] }; refreshSheet(); }; rd.readAsText(file); return;
  }
  if (el.id === 'shakeKcal') { const d = el.dataset.date, v = el.value === '' ? null : clamp(Math.round(+el.value), 0, 3000); S.shakes[d] = { ...(S.shakes[d] || {}), taken: true, kcal: v }; save(); return; }
  if (el.id === 'wDate') { ui.weightDate = el.value; return; }
  if (el.id === 'reducedToggle') { haptic(6); return; }
  if (!c) return;
  if (c === 'path') {
    const p = el.dataset.path, cur = getPath(p);
    let v = el.value;
    if (el.type === 'number' || el.dataset.num) { v = v.trim() === '' ? null : parseFloat(String(v).replace(',', '.')); if (v != null && !isFinite(v)) { el.value = cur ?? ''; return; } }
    if (p === 'profile.name') v = (v || 'Théo').slice(0, 40);
    if (['profile.heightCm', 'profile.startWeightKg', 'profile.gainLowG', 'profile.gainHighG', 'profile.proteinG'].includes(p) && (v == null || v <= 0)) { el.value = cur; return; }
    setPath(p, v); save(); render(); return;
  }
  if (c === 'bool') { setPath(el.dataset.path, el.checked); save(); return; }
  if (c === 'shake') { const d = el.dataset.date; const prev = S.shakes[d] || {}; S.shakes[d] = { taken: el.checked, kcal: el.checked ? (prev.kcal ?? S.profile.recipe.kcal ?? null) : prev.kcal ?? null }; save(); haptic(8); setTimeout(() => { rerender(); if (el.checked) { const k = document.getElementById('shakeKcal'); if (k) k.classList.add('pop'); } }, RM() ? 0 : 280); return; }
  if (c === 'runDurIn') { const pw = +el.dataset.pw, k = el.dataset.k; S.plan.runs[pw][k] = clamp(Math.round(+el.value || 0), 0, 90); el.value = S.plan.runs[pw][k]; save(); render(); return; }
  if (c === 'sReduced') { const s = curSess(); if (s && s.status === 'active') { s.reduced = el.checked; save(); haptic(6); setTimeout(renderSession, RM() ? 0 : 280); } return; }
  if (c === 'band' || c === 'grip') { const s = curSess(), ex = s && s.ex[+el.dataset.i]; if (ex) { ex[c] = el.value.slice(0, 60); save(); } return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'repsIn') { const s = curSess(), ex = s && s.ex[s.pos]; if (ex && ex.draft) { ex.draft.reps = clamp(Math.round(+el.value || 0), 0, 120); save(); } }
  if (el.id === 'sNote') { const s = curSess(); if (s) { s.note = el.value.slice(0, 400); save(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') { if (!document.getElementById('celebrate').hidden) closeCelebrate(); else if (!document.getElementById('sheet').hidden) closeSheet(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (ui.sess) requestWake(); } });
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { S = load(); applyTheme(); render(); renderSession(); } });

let DL = null, tickTimer = null;
function applyTheme() {
  const dark = S.profile.theme === 'dark';
  document.documentElement.dataset.ui = dark ? 'dark' : 'light';
  let m = document.querySelector('meta[name=theme-color]'); if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = dark ? '#080C0D' : '#DDF2EA';
}
function boot() {
  applyTheme();
  route = readRoute();
  if (S.active && S.sessions[S.active]?.status === 'active') ui.sess = true;
  else if (S.active && S.sessions[S.active]?.status === 'done') S.active = null;
  render(); renderSession();
  tickTimer = setInterval(() => { if (S.timer || S.stopwatch) tick(); }, 250);
  if (FRAMED) { try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d => { DL = d || null; if (DL) refreshSheet(); }, () => { }); } catch (e) { } }
  else {
    const add = (rel, href) => { const l = document.createElement('link'); l.rel = rel; l.href = href; document.head.appendChild(l); };
    add('manifest', 'manifest.webmanifest');
    add('apple-touch-icon', 'icons/apple-touch-icon-v2.png');
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
boot();
