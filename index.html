/* Layout : colonne unique pensée pour le pouce, barre d’onglets fixe en bas, séance plein écran. */
:root {
  color-scheme: dark;
  --bg: #090D0E; --bg2: #0E1416; --card: #131B1D; --raise: #1B2528; --line: #233032; --line2: #2E3D3F;
  --fg: #EDF4F1; --muted: #9DAEA9; --dim: #82938E;
  --acc: #3DF2A0; --acc2: #22C985; --acc-ink: #03160C; --acc-soft: rgba(61, 242, 160, .11); --acc-line: rgba(61, 242, 160, .35);
  --run: #62B8FF; --run-soft: rgba(98, 184, 255, .12); --run-line: rgba(98, 184, 255, .38);
  --warn: #FFC861; --warn-soft: rgba(255, 200, 97, .12); --bad: #FF8378; --bad-soft: rgba(255, 131, 120, .13);
  --fig: #E8F0ED; --fig-far: #61746F; --mat: #1C2928; --stage: #0F1618;
  --f-display: 'Saira Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 20px; --r-sm: 13px; --ease: cubic-bezier(.2, .8, .2, 1);
  --tab-h: 66px;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { background: var(--bg); color: var(--fg); }
body { margin: 0; font: 400 15px/1.45 var(--f-body); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden; }
body.noscroll { overflow: hidden; }
[hidden] { display: none !important; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; border-radius: 8px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- structure ---------- */
#app { max-width: 560px; margin: 0 auto; padding: 18px 16px calc(var(--tab-h) + 28px + env(safe-area-inset-bottom, 0px)); }
.screen { display: flex; flex-direction: column; gap: 14px; animation: in .22s var(--ease); }
@keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.top { display: flex; flex-direction: column; gap: 2px; padding: 4px 2px 6px; }
.eyebrow { font: 600 12px/1.2 var(--f-body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.title-xl { font: 700 34px/1.02 var(--f-display); letter-spacing: .01em; }
.top-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 8px; font: 700 13px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.brand i { width: 8px; height: 8px; border-radius: 50%; background: var(--acc); box-shadow: 0 0 12px var(--acc); }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card.flat { background: transparent; }
.card h2 { font: 700 21px/1.1 var(--f-display); letter-spacing: .02em; }
.card h3 { font: 600 15px/1.25 var(--f-body); }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.row.between { justify-content: space-between; }
.row.wrap { flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.xs { font-size: 12px; }
.note { font-size: 13px; color: var(--muted); }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100%; }

/* ---------- héros du jour ---------- */
.hero { position: relative; overflow: hidden; border-radius: 26px; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 14px;
  background: radial-gradient(120% 90% at 100% 0%, rgba(61, 242, 160, .16), transparent 55%), linear-gradient(180deg, #152022, #101719); border: 1px solid var(--acc-line); }
.hero.run { background: radial-gradient(120% 90% at 100% 0%, rgba(98, 184, 255, .18), transparent 55%), linear-gradient(180deg, #141E25, #0F161A); border-color: var(--run-line); }
.hero.rest { background: linear-gradient(180deg, #151D1F, #111819); border-color: var(--line2); }
.hero .kicker { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.hero-name { font: 800 64px/.86 var(--f-display); letter-spacing: -.005em; text-transform: uppercase; }
.hero-name small { display: block; font: 600 15px/1.2 var(--f-body); letter-spacing: 0; text-transform: none; color: var(--muted); margin-top: 8px; }
.metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.metrics.three { grid-template-columns: repeat(3, 1fr); }
.metric { background: rgba(0, 0, 0, .22); border: 1px solid rgba(255, 255, 255, .05); border-radius: 14px; padding: 9px 10px; min-width: 0; }
.metric b { display: block; font: 700 26px/1 var(--f-display); font-variant-numeric: tabular-nums; }
.metric span { display: block; font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.2; }
.exmini { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; counter-reset: e; }
.exmini li { display: grid; grid-template-columns: 22px 1fr auto; gap: 8px; align-items: baseline; font-size: 14px; counter-increment: e; }
.exmini li::before { content: counter(e); font: 700 14px/1 var(--f-display); color: var(--acc); }
.exmini li.comp::before { color: var(--muted); }
.exmini li span:last-child { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- boutons ---------- */
.btn { appearance: none; border: 1px solid var(--line2); background: var(--raise); color: var(--fg); border-radius: 14px; min-height: 46px; padding: 10px 16px;
  font: 600 15px/1.15 var(--f-body); display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center;
  transition: transform .12s var(--ease), background-color .15s, border-color .15s, opacity .15s; touch-action: manipulation; user-select: none; }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .42; cursor: not-allowed; transform: none; }
.btn.primary { background: var(--acc); color: var(--acc-ink); border-color: transparent; font-weight: 700; }
.btn.primary:active { background: var(--acc2); }
.btn.runb { background: var(--run); color: #031423; border-color: transparent; font-weight: 700; }
.btn.ghost { background: transparent; }
.btn.danger { background: var(--bad-soft); color: var(--bad); border-color: rgba(255, 131, 120, .35); }
.btn.xl { min-height: 60px; border-radius: 18px; font: 700 20px/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; }
.btn.block { width: 100%; }
a.btn { text-decoration: none; }
.btn.sm { min-height: 38px; padding: 7px 12px; font-size: 14px; border-radius: 11px; }
.btn.icon { width: 46px; padding: 0; flex: none; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1 1 auto; }
.linkbtn { appearance: none; background: none; border: 0; padding: 4px 0; color: var(--acc); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* ---------- pastilles ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 600 12px/1.2 var(--f-body); letter-spacing: .02em;
  background: var(--raise); color: var(--muted); border: 1px solid var(--line2); white-space: nowrap; }
.pill.acc { background: var(--acc-soft); color: var(--acc); border-color: var(--acc-line); }
.pill.run { background: var(--run-soft); color: var(--run); border-color: var(--run-line); }
.pill.warn { background: var(--warn-soft); color: var(--warn); border-color: rgba(255, 200, 97, .35); }
.pill.bad { background: var(--bad-soft); color: var(--bad); border-color: rgba(255, 131, 120, .35); }
.pill.solid { background: var(--acc); color: var(--acc-ink); border-color: transparent; }

.alert { border-radius: 16px; padding: 12px 14px; font-size: 14px; display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line2); background: var(--raise); }
.alert svg { width: 18px; height: 18px; flex: none; margin-top: 1px; }
.alert.warn { background: var(--warn-soft); border-color: rgba(255, 200, 97, .32); }
.alert.warn svg { color: var(--warn); }
.alert.bad { background: var(--bad-soft); border-color: rgba(255, 131, 120, .35); }
.alert.bad svg { color: var(--bad); }
.alert.acc { background: var(--acc-soft); border-color: var(--acc-line); }
.alert.acc svg { color: var(--acc); }
.alert.info svg { color: var(--run); }
.medline { font-size: 12.5px; color: var(--muted); line-height: 1.45; display: flex; gap: 8px; }
.medline svg { width: 15px; height: 15px; flex: none; color: var(--warn); margin-top: 2px; }

/* ---------- champs ---------- */
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > span { font-size: 13px; color: var(--muted); font-weight: 500; }
.input, textarea.input, select.input { width: 100%; min-height: 46px; border-radius: 13px; border: 1px solid var(--line2); background: var(--bg2); padding: 10px 12px; font-size: 16px; }
textarea.input { min-height: 90px; resize: vertical; line-height: 1.4; }
.input:focus { border-color: var(--acc); outline: none; box-shadow: 0 0 0 3px var(--acc-soft); }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.check { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 12px; border-radius: 14px; border: 1px solid var(--line2); background: var(--bg2); cursor: pointer; }
.check input { width: 22px; height: 22px; accent-color: var(--acc); flex: none; }
.check.on { border-color: var(--acc-line); background: var(--acc-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { appearance: none; min-height: 42px; min-width: 42px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line2); background: var(--bg2); font: 600 15px/1 var(--f-body);
  transition: transform .1s var(--ease), background-color .15s, border-color .15s; font-variant-numeric: tabular-nums; }
.chip:active { transform: scale(.95); }
.chip.on { background: var(--acc); color: var(--acc-ink); border-color: transparent; }
.chip.hint:not(.on) { border-color: var(--acc-line); color: var(--acc); }
.chip.runon.on { background: var(--run); color: #031423; }
.chip.badon.on { background: var(--bad); color: #250604; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; cursor: pointer; }
.toggle input { appearance: none; width: 48px; height: 28px; border-radius: 99px; background: var(--line2); position: relative; flex: none; transition: background-color .15s; cursor: pointer; }

.days { display: flex; flex-direction: column; gap: 6px; }
.day { appearance: none; display: grid; grid-template-columns: 54px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg2); text-align: left; width: 100%; min-height: 56px; transition: transform .1s var(--ease); }
.day:active { transform: scale(.985); }
.day .dd { font: 700 15px/1.05 var(--f-display); letter-spacing: .04em; text-transform: uppercase; }

.day .dw b { display: block; font-weight: 600; font-size: 14.5px; }
.day .dw i { font-style: normal; font-size: 12.5px; color: var(--muted); }
.day.today { border-color: var(--acc-line); box-shadow: inset 3px 0 0 var(--acc); }

.params { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }

/* ---------- graphique ---------- */

/* minuteur de repos */
#restbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; padding: 10px 12px calc(10px + env(safe-area-inset-bottom, 0px)); background: rgba(14, 20, 22, .97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--acc-line); animation: up .2s var(--ease); }
.rb-in { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 8px; }

  padding: 10px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; animation: up .24s var(--ease); }

.pr h3 { font: 700 16px/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .03em; margin: 0 0 4px; }

.pr .cal td.s { background: #E9F8F0; font-weight: 600; }
.pr .cal td.c { background: #EAF3FC; }
.pr .exs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pr .exc { border: 1px solid #C5CFCC; border-radius: 10px; padding: 10px; break-inside: avoid; display: flex; flex-direction: column; gap: 6px; }
.pr .exc .pair figcaption { color: #44514E; }

.pr .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.pr .box { border: 1px solid #C5CFCC; border-radius: 10px; padding: 10px; break-inside: avoid; }

@media (max-width: 520px) { .pr .exs, .pr .cols { grid-template-columns: 1fr; } }

@media print {

  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

<script>
/* ===== Silhouette articulée : cinématique simple (2 segments par membre) ===== */
const FIG = (() => {
  const L = { torso: 50, neck: 14, head: 10.5, ua: 28, fa: 26, th: 42, sh: 40, foot: 15 };
  const R = Math.PI / 180;
  const dir = (a, l = 1) => [Math.cos(a * R) * l, Math.sin(a * R) * l];
  const add = (p, v) => [p[0] + v[0], p[1] + v[1]];
  const mul = (v, k) => [v[0] * k, v[1] * k];
  const ang = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / R;
  const dist = (a, b) => Math.hypot(b[0] - a[0], b[1] - a[1]);
  const lerp = (a, b, t) => a + (b - a) * t;
  const lp = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  const ease = t => 0.5 - Math.cos(Math.PI * t) / 2;

  function ik(root, target, l1, l2, bend) {
    let d = dist(root, target);
    const base = ang(root, target);
    d = Math.max(Math.abs(l1 - l2) + 0.01, Math.min(l1 + l2 - 0.01, d));
    const c = (l1 * l1 + d * d - l2 * l2) / (2 * l1 * d);
    const a = Math.acos(Math.max(-1, Math.min(1, c))) / R;
    const j = add(root, dir(base + bend * a, l1));
    const e = add(j, dir(ang(j, target), l2));
    return [root, j, e];
  }
  function chain(root, s, l1, l2) {
    const k1 = s.s1 ?? 1, k2 = s.s2 ?? 1;
    if (s.ik) return ik(root, s.ik, l1 * k1, l2 * k2, s.bend ?? 1);
    const j = add(root, dir(s.a[0], l1 * k1));
    return [root, j, add(j, dir(s.a[1], l2 * k2))];
  }
  function solve(p) {
    const hip = p.hip;
    const S = p.shoulder || add(hip, dir(p.torso, L.torso));
    const tA = p.shoulder ? ang(hip, S) : p.torso;
    const n = dir(tA + 90);
    const sw = (p.sw ?? 3) / 2, hw = (p.hw ?? 3) / 2;
    const sN = add(S, mul(n, sw)), sF = add(S, mul(n, -sw));
    const hN = add(hip, mul(n, hw)), hF = add(hip, mul(n, -hw));
    const head = add(S, dir(p.headAbs ?? (tA + (p.headTilt || 0)), L.neck));
    const o = { hip, S, sN, sF, hN, hF, head, tA };
    o.armN = chain(sN, p.armN, L.ua, L.fa);
    o.armF = chain(sF, p.armF || p.armN, L.ua, L.fa);
    o.legN = chain(hN, p.legN, L.th, L.sh);
    o.legF = chain(hF, p.legF || p.legN, L.th, L.sh);
    const foot = (leg, a, k) => { const an = leg[2]; return [add(an, dir(a + 180, 4 * k)), add(an, dir(a, L.foot * k))]; };
    o.footN = foot(o.legN, p.footN ?? 0, p.footS ?? 1);
    o.footF = foot(o.legF, p.footF ?? p.footN ?? 0, p.footS ?? 1);
    return o;
  }
  const P = pts => pts.map((q, i) => (i ? 'L' : 'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');

  // ordre de dessin (arrière -> avant)
  function parts(p, o, ex) {
    const front = !!p.front;
    const far = front ? 'fg' : 'ff';
    const list = [
      { k: 'bx', t: 'path', c: 'fx-band', d: '' },
      { k: 'armF', t: 'path', c: far + ' w-arm', d: P(o.armF) },
      { k: 'legF', t: 'path', c: far + ' w-leg', d: P(o.legF) },
      { k: 'footF', t: 'path', c: far + ' w-foot', d: P(o.footF) },
      { k: 'handF', t: 'circle', c: far, cx: o.armF[2][0], cy: o.armF[2][1], r: p.handR ?? 4 },
      { k: 'torso', t: 'path', c: 'fg fill', d: P([o.sN, o.sF, o.hF, o.hN]) + ' Z', sw: p.torsoW ?? 17 },
      { k: 'head', t: 'circle', c: 'fg', cx: o.head[0], cy: o.head[1], r: L.head },
      { k: 'legN', t: 'path', c: 'fg w-leg', d: P(o.legN) },
      { k: 'footN', t: 'path', c: 'fg w-foot', d: P(o.footN) },
      { k: 'armN', t: 'path', c: 'fg w-arm', d: P(o.armN) },
      { k: 'handN', t: 'circle', c: 'fg', cx: o.armN[2][0], cy: o.armN[2][1], r: p.handR ?? 4 },
      { k: 'fx', t: 'path', c: 'fx-band', d: '' },
      { k: 'fx2', t: 'path', c: 'fx-line', d: '' }
    ];
    if (ex.extras) {
      const e = ex.extras(o, p) || {};
      for (const it of list) if (e[it.k] != null) it.d = e[it.k];
    }
    return list;
  }

  const VB = '0 0 320 190';
  function bg(ex) {
    let s = '<rect class="mat" x="18" y="172" width="284" height="7" rx="3.5"></rect>';
    if (ex.wall) s += '<rect class="wall" x="' + ex.wall + '" y="10" width="8" height="162"></rect>';
    if (ex.bgx) s += ex.bgx;
    return s;
  }
  function el(it) {
    if (it.t === 'circle') return '<circle data-p="' + it.k + '" class="' + it.c + '" cx="' + it.cx.toFixed(1) + '" cy="' + it.cy.toFixed(1) + '" r="' + it.r + '"></circle>';
    return '<path data-p="' + it.k + '" class="' + it.c + '" d="' + it.d + '"' + (it.sw ? ' style="stroke-width:' + it.sw + 'px"' : '') + '></path>';
  }
  function svg(ex, t = 0, side = 1, extraCls = '') {
    const p = ex.pose(t, side);
    const o = solve(p);
    const inset = ex.inset ? '<g data-inset>' + ex.inset(t, side) + '</g>' : '';
    return '<svg class="fig ' + extraCls + '" viewBox="' + VB + '" role="img" aria-label="' + ex.name + '">' + bg(ex) + parts(p, o, ex).map(el).join('') + inset + '</svg>';
  }
  function update(svgEl, ex, t, side) {
    const p = ex.pose(t, side), o = solve(p);
    for (const it of parts(p, o, ex)) {
      const n = svgEl.querySelector('[data-p="' + it.k + '"]');
      if (!n) continue;
      if (it.t === 'circle') { n.setAttribute('cx', it.cx.toFixed(1)); n.setAttribute('cy', it.cy.toFixed(1)); }
      else n.setAttribute('d', it.d);
    }
    if (ex.inset) { const g = svgEl.querySelector('[data-inset]'); if (g) g.innerHTML = ex.inset(t, side); }
  }

  // Lecture d'une séquence : [{to, dur, label, side}, {hold, label}]
  function sample(seq, ms) {
    const total = seq.reduce((a, s) => a + (s.dur || s.hold || 0), 0);
    let tm = ((ms % total) + total) % total, cur = 0, side = 1;
    for (const s of seq) {
      if (s.side) side = s.side;
      const d = s.dur || s.hold;
      if (tm <= d) {
        if (s.hold) return { t: cur, side, label: s.label, total };
        const t = lerp(cur, s.to, ease(tm / d));
        return { t, side, label: s.label, total };
      }
      tm -= d;
      if (!s.hold) cur = s.to;
    }
    return { t: cur, side, label: '', total };
  }

  return { L, dir, add, mul, ang, dist, lerp, lp, ease, solve, svg, update, sample, P };
})();

    const work = ex.unit === 'sec' ? (targetSec(id) + 15) * (ex.perSide ? 2 : 1) : (ex.range[0] + ex.range[1]) / 2 * 3 * (ex.perSide ? 2 : 1);
    const rest = (ex.rest[0] + ex.rest[1]) / 2;
    sec += pr.sets * work + (pr.sets - 1) * rest + 75;
  });
  return Math.round(sec / 60);
}

/* ---- progression musculation ---- */
function doneLogs(id) {
  return Object.values(S.sessions).filter(s => s.status === 'done' && !s.reduced)
    .sort((a, b) => b.date.localeCompare(a.date))
    .flatMap(s => s.ex.filter(e => e.id === id && !e.skipped && e.sets.length).map(e => ({ s, e })));
}
function passes({ s, e }) {
  const ex = EX[e.id], pr = prescFor(s, e.slot);
  if (e.sets.length < pr.sets || e.tech !== 'clean') return false;
  const top = ex.unit === 'sec' ? targetSec(e.id, e.level) : ex.range[1];
  const rmin = ex.unit === 'sec' ? 5 : pr.rmin;
  return e.sets.slice(0, pr.sets).every(x => x.reps >= top && x.rir >= rmin);
}
function canLevelUp(id) {
  const ex = EX[id], lvl = levelOf(id);
  if (ex.band) return true;
  if (ex.unit === 'sec') return targetSec(id) < 30;
  return lvl < ex.levels.length - 1;
}
function nextLevelText(id) {
  const ex = EX[id], lvl = levelOf(id);
  if (ex.band) return ex.prog;
  if (ex.unit === 'sec') return 'Tenue cible : ' + (targetSec(id) + 5) + ' s par côté';
  return ex.levels[lvl + 1];
}
function suggestion(id) {
  const lvl = levelOf(id);
  const logs = doneLogs(id).filter(x => x.e.level === lvl);
  if (!canLevelUp(id)) return { state: 'max' };
  const last2 = logs.slice(0, 2);
  const ok = last2.filter(passes).length;
  if (last2.length < 2 || ok < 2) return { state: 'building', ok: last2.length && passes(last2[0]) ? (last2[1] && passes(last2[1]) ? 2 : 1) : 0 };
  const lastDate = last2[0].s.date;
  const ci = calInfo(today());
  if (!ci.noStart && !ci.before && !ci.after && ci.pw === 8) return { state: 'hold8' };
  const dis = S.sugg.dismissed[id];
  if (dis && dis >= lastDate) return { state: 'later' };
  return { state: 'ready', lastDate };
}
function acceptLevel(id) {
  const lvl = levelOf(id);
  const cur = S.levels[id] || { level: 0, hist: [] };
  cur.level = lvl + 1; cur.hist = (cur.hist || []).concat({ date: today(), from: lvl, to: lvl + 1 });
  S.levels[id] = cur;
  // la séance en cours, si elle contient cet exercice sans série validée, passe au nouveau niveau
  const a = S.active && S.sessions[S.active];
  if (a && a.status === 'active') a.ex.forEach(e => { if (e.id === id && !e.sets.length) e.level = cur.level; });
  save();
}
function progressIds() {
  const ids = ['squat', 'squat_tempo', 'pushup_knee', 'pushup_wall', 'row_band', 'glute_bridge', 'dead_bug', 'side_abduction', 'band_pull_apart', 'side_plank_knee'];
  return ids.filter(id => id !== 'pushup_wall' || S.profile.pushVariant === 'pushup_wall' || doneLogs('pushup_wall').length);
}

const RUNKINDS = { run: 'Course facile', runwalk: 'Course et marche', walk: 'Marche', badminton: 'Badminton (remplace la sortie)', skipped: 'Non faite' };
function runFlag(r) { return !!(r.painDuring || r.painAfter || r.swelling || r.limp || (r.nextDay && !r.nextDay.ok)); }
function lastFootFlag() {
  const dates = [];
  for (const d in S.runs) if (runFlag(S.runs[d])) dates.push(d);
  for (const d in S.sessions) { const s = S.sessions[d]; if (s.status === 'done' && s.pain && (s.painWhere || []).includes('Pied gauche')) dates.push(d); }
  dates.sort();
  const last = dates[dates.length - 1];
  if (!last) return null;
  if (S.runClearedAt && S.runClearedAt >= last) return null;
  return last;
}
function runAdvice(date) {
  const flag = lastFootFlag();
  if (flag) return { level: 'stop', text: 'Signal au pied noté le ' + fmtD(flag) + ' : pas de course pour l’instant. Demande un avis médical avant de reprendre.' };
  const prev = Object.values(S.runs).filter(r => r.date < date && (r.kind === 'run' || r.kind === 'runwalk')).sort((a, b) => b.date.localeCompare(a.date))[0];
  if (!prev) return { level: 'ok' };
  if (!prev.nextDay) return { level: 'hold', cap: prev.minutes, text: 'État du pied non noté le lendemain de ta sortie du ' + fmtD(prev.date) + ' : ne dépasse pas ' + prev.minutes + ' min.' };
  if (prev.legsTired || prev.effort >= 6) return { level: 'hold', cap: prev.minutes, text: 'Dernière sortie avec jambes très fatiguées ou effort élevé : reste à ' + prev.minutes + ' min maximum.' };
  return { level: 'ok' };
}
function pendingFootCheck() {
  const y = addD(today(), -1), y2 = addD(today(), -2);
  for (const d of [y, y2]) { const r = S.runs[d]; if (r && ['run', 'runwalk', 'badminton'].includes(r.kind) && !r.nextDay) return r; }

}

/* ---- poids ---- */
function weeklyWeights() {
  const g = {};
  for (const w of S.weights) { const m = mondayOf(w.date); (g[m] = g[m] || []).push(w.kg); }
  return Object.keys(g).sort().map(m => ({ week: m, n: g[m].length, avg: g[m].reduce((a, b) => a + b, 0) / g[m].length }));
}
function weightTrend() {
  const ws = weeklyWeights().filter(w => w.n >= 2);
  if (ws.length < 2) return null;
  const a = ws[0], b = ws[ws.length - 1], weeks = diffD(a.week, b.week) / 7;
  if (weeks < 1) return null;
  return { perWeekG: (b.avg - a.avg) * 1000 / weeks, weeks, from: a, to: b };
}
function shakeDaysInWeek(m) { let n = 0; for (let i = 0; i < 7; i++) if (S.shakes[addD(m, i)]?.taken) n++; return n; }
function kcalSuggestion() {
  const thisMon = mondayOf(today());
  const ws = weeklyWeights().filter(w => w.week < thisMon);
  if (ws.length < 3) return null;
  const last3 = ws.slice(-3);
  if (diffD(last3[0].week, last3[2].week) !== 14) return null;
  if (!last3.every(w => w.n >= 2)) return null;
  if (!last3.every(w => shakeDaysInWeek(w.week) >= 5)) return null;
  if (last3[2].avg - last3[0].avg > 0.1) return null;
  if (S.kcalSugg.dismissedWeek && S.kcalSugg.dismissedWeek >= last3[2].week) return null;
  return { weeks: last3 };
}

const RM = () => { try { return matchMedia('(prefers-reduced-motion: reduce)').matches; } catch (e) { return false; } };
class Stage {
  constructor(el) {
    this.el = el; this.ex = EX[el.dataset.stage]; this.svg = el.querySelector('svg'); this.range = el.querySelector('input[type=range]');
    this.lbl = el.querySelector('[data-lbl]'); this.btn = el.querySelector('[data-act=stagePlay]');
    this.ms = 0; this.playing = false; this.last = 0; this.total = FIG.sample(this.ex.seq, 0).total;
    this.range.addEventListener('input', () => { this.stop(); this.ms = this.range.value / 1000 * this.total; this.draw(); });
    this.draw();

  }
  play() { if (this.playing) return; this.playing = true; this.btn.innerHTML = I.pause; this.last = performance.now(); const f = now => { if (!this.playing) return; this.ms += now - this.last; this.last = now; this.draw(); this.raf = requestAnimationFrame(f); }; this.raf = requestAnimationFrame(f); }

  draw() {
    const s = FIG.sample(this.ex.seq, this.ms);
    FIG.update(this.svg, this.ex, s.t, s.side);
    this.range.value = Math.round(((this.ms % this.total) / this.total) * 1000);

  }
}

/* ===== Progression et Profil ===== */
function weightChart() {
  const ws = weeklyWeights();
  if (ws.length < 2) return '<p class="note">Le graphique apparaît dès que deux semaines contiennent des pesées.</p>';
  const W = 320, H = 150, L = 34, Rr = 10, T = 12, B = 26;
  const first = ws[0].week, span = Math.max(1, diffD(first, ws[ws.length - 1].week) / 7);
  const g = S.profile, gl = g.gainLowG / 1000, gh = g.gainHighG / 1000;
  const vals = ws.map(w => w.avg).concat([ws[0].avg + gh * span]);
  let lo = Math.min(...vals) - 0.3, hi = Math.max(...vals) + 0.3;
  if (hi - lo < 1.2) { const m = (hi + lo) / 2; lo = m - 0.6; hi = m + 0.6; }
  const x = w => L + (diffD(first, w) / 7) / span * (W - L - Rr);
  const y = v => T + (hi - v) / (hi - lo) * (H - T - B);
  const x0 = x(first), xN = x(ws[ws.length - 1].week), y0 = ws[0].avg;
  let s = '<svg viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Moyennes hebdomadaires du poids"><defs><linearGradient id="wgrad" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3DF2A0" stop-opacity=".22"/><stop offset="1" stop-color="#3DF2A0" stop-opacity="0"/></linearGradient></defs>';
  [lo + 0.15 * (hi - lo), (lo + hi) / 2, hi - 0.15 * (hi - lo)].forEach(v => { s += '<line class="gl" x1="' + L + '" x2="' + (W - Rr) + '" y1="' + y(v).toFixed(1) + '" y2="' + y(v).toFixed(1) + '"></line><text x="' + (L - 6) + '" y="' + (y(v) + 4).toFixed(1) + '" text-anchor="end">' + num(v, 1) + '</text>'; });
  s += '<polygon class="band" points="' + x0 + ',' + y(y0) + ' ' + xN + ',' + y(y0 + gh * span) + ' ' + xN + ',' + y(y0 + gl * span) + '"></polygon>';
  const pts = ws.map(w => [x(w.week), y(w.avg)]);
  s += '<path class="ar" d="M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + ' L' + pts[pts.length - 1][0].toFixed(1) + ' ' + (H - B) + ' L' + pts[0][0].toFixed(1) + ' ' + (H - B) + ' Z"></path>';
  s += '<path class="ln" d="M' + pts.map(p => p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' L') + '"></path>';
  pts.forEach((p, i) => { s += '<circle class="pt' + (i === pts.length - 1 ? ' last' : '') + '" cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) + '" r="' + (ws[i].n >= 2 ? 4.5 : 3) + '"></circle>'; });
  s += '<text x="' + x0 + '" y="' + (H - 8) + '">' + fmtShort(first) + '</text><text x="' + xN + '" y="' + (H - 8) + '" text-anchor="end">' + fmtShort(ws[ws.length - 1].week) + '</text></svg>';
  return '<div class="chart">' + s + '</div><p class="note">Ligne : moyenne de chaque semaine (petit point = une seule pesée). Zone verte : repère de ' + g.gainLowG + ' à ' + g.gainHighG + ' g par semaine à partir de ta première moyenne, sans promesse de résultat.</p>';
}

function render() {

function setPath(path, val) { const ks = path.split('.'); let o = S; for (let i = 0; i < ks.length - 1; i++) o = o[ks[i]]; o[ks[ks.length - 1]] = val; }
function getPath(path) { return path.split('.').reduce((o, k) => o && o[k], S); }

function exportPayload() { return JSON.stringify({ app: APP_ID, schema: SCHEMA, exportedAt: new Date().toISOString(), data: { ...S, active: S.active, timer: null, stopwatch: null } }, null, 1); }
function validateImport(txt) {
  let o;
  try { o = JSON.parse(txt); } catch (e) { return { ok: false, errors: ['Ce n’est pas un fichier JSON lisible.'] }; }
  const errors = [];
  if (!isObj(o)) errors.push('Contenu inattendu.');
  else {
    if (o.app !== APP_ID) errors.push('Ce fichier ne vient pas de cette application.');
    if (o.schema !== SCHEMA) errors.push('Version de sauvegarde non reconnue.');
    const d = o.data;
    if (!isObj(d)) errors.push('Données absentes.');
    else {
      if (!isObj(d.profile) || !isObj(d.plan)) errors.push('Profil ou programme manquant.');
      if (d.plan && d.plan.startDate != null && !isDate(d.plan.startDate)) errors.push('Date de départ invalide.');
      if (d.weights && !Array.isArray(d.weights)) errors.push('Pesées illisibles.');
      for (const k of ['sessions', 'runs', 'shakes']) if (d[k] && !isObj(d[k])) errors.push('Rubrique « ' + k + ' » illisible.');
    }
  }
  if (errors.length) return { ok: false, errors };
  const n = normalize(o.data);
  const sum = Object.keys(n.sessions).length + ' séance(s), ' + Object.keys(n.runs).length + ' sortie(s), ' + n.weights.length + ' pesée(s)' + (n.plan.startDate ? ', départ le ' + fmtD(n.plan.startDate) : '');
  return { ok: true, data: n, sum, when: o.exportedAt ? new Date(o.exportedAt).toLocaleString('fr-FR') : 'date inconnue' };
}
function addWeight(date, val) {
  const kg = Math.round(parseFloat(String(val).replace(',', '.')) * 10) / 10;
  if (!isDate(date) || !(kg >= 30 && kg <= 200)) { toast('Indique un poids entre 30 et 200 kg.'); return false; }
  if (date > today()) { toast('La date ne peut pas être dans le futur.'); return false; }
  S.weights = S.weights.filter(w => w.date !== date).concat({ date, kg });
  save(); toast('Pesée du ' + fmtD(date) + ' : ' + num(kg, 1) + ' kg'); return true;
}

  if (!isDate(v)) return;
  const m = nextMonday(v);
  S.plan.startDate = m; ui.week = null; save(); render();
  toast(m === v ? 'Départ le ' + fmtDl(m) : 'Départ calé au lundi suivant : ' + fmtD(m));
}

  footBad(el) { const r = S.runs[el.dataset.date]; if (r) { r.nextDay = { ok: false, at: today() }; save(); render(); openSheet(sheetHead('Signal au pied') + alertBox('bad', 'warn', 'Douleur ou gonflement le lendemain : pas de course, et demande un avis médical. L’application ne peut pas évaluer la consolidation de la fracture.') + '<button class="btn block" data-act="closeSheet">Compris</button>'); } },
  clearFlag() { S.runClearedAt = today(); save(); render(); toast('Signal levé. Reprends en douceur.'); },
  addWeightQuick() { const v = document.getElementById('wQuick').value; if (addWeight(today(), v)) render(); },
  addWeight() { const d = document.getElementById('wDate').value, v = document.getElementById('wKg').value; ui.weightDate = d; if (addWeight(d, v)) render(); },
  delWeight(el) { S.weights = S.weights.filter(w => w.date !== el.dataset.date); save(); render(); toast('Pesée supprimée.'); },
  kcalYes() { const ks = kcalSuggestion(); S.profile.nutritionNotes.push({ date: today(), text: 'Ajout envisagé : environ 100 à 150 kcal par jour' }); S.kcalSugg.dismissedWeek = ks ? ks.weeks[2].week : mondayOf(today()); save(); render(); toast('Noté. À toi de l’intégrer à tes repas.'); },
  kcalNo() { const ks = kcalSuggestion(); S.kcalSugg.dismissedWeek = ks ? ks.weeks[2].week : mondayOf(today()); save(); render(); },
  acceptLevel(el) { const id = el.dataset.id; acceptLevel(id); toast('Nouveau niveau : ' + levelLabel(id)); ui.sess ? renderSession() : render(); },
  laterLevel(el) { const id = el.dataset.id, sg = suggestion(id); S.sugg.dismissed[id] = sg.lastDate || today(); save(); ui.sess ? renderSession() : render(); },
  runDur(el) { const pw = +el.dataset.pw, k = el.dataset.k; S.plan.runs[pw][k] = clamp(S.plan.runs[pw][k] + (+el.dataset.d), 0, 90); save(); const inp = document.getElementById('rd-' + pw + '-' + k); if (inp) inp.value = S.plan.runs[pw][k]; },
  runReset(el) { const pw = +el.dataset.pw; S.plan.runs[pw] = { ...RUN_DEFAULT[pw] }; save(); render(); },
  repeatWeek(el) { const i = +el.dataset.i; confirmSheet('Répéter la semaine ' + S.plan.seq[i] + ' ?', 'La semaine qui suit devient une répétition de la semaine ' + S.plan.seq[i] + ', et la suite du programme se décale de sept jours.', 'repeatDo', 'Répéter', 'data-i="' + i + '"'); },
  repeatDo(el) { const i = +el.dataset.i; if (!canRepeat(i)) return; S.plan.seq.splice(i + 1, 0, S.plan.seq[i]); ui.week = i + 1; save(); closeSheet(); render(); toast('Semaine ' + S.plan.seq[i] + ' répétée.'); },
  undoRepeat(el) { const i = +el.dataset.i; if (!canUndoRepeat(i)) return; S.plan.seq.splice(i, 1); ui.week = Math.max(0, i - 1); save(); render(); toast('Répétition annulée.'); },
  addBand() { const n = document.getElementById('bandName').value.trim(), note = document.getElementById('bandNote').value.trim(); if (!n) { toast('Donne un nom à la bande.'); return; } S.profile.bands.push({ id: Math.random().toString(36).slice(2, 9), name: n.slice(0, 40), note: note.slice(0, 120) }); save(); render(); },
  delBand(el) { S.profile.bands = S.profile.bands.filter(b => b.id !== el.dataset.id); save(); render(); },
  exportFile() {
    if (FRAMED) {
      if (!DL) return;
      DL.save({ filename: 'theo-8-semaines-' + today() + '.json', data: exportPayload() }).then(r => toast(r.status === 'saved' ? 'Sauvegarde enregistrée.' : 'Sauvegarde envoyée.'), e => { const c = e && e.code; toast(c === 'declined' ? 'Enregistrement annulé.' : c === 'rate_limited' ? 'Une demande est déjà ouverte.' : 'Enregistrement impossible ici : utilise « Copier ».'); if (c === 'unavailable' || c === 'not_granted' || c === 'capability_disabled' || c === 'capability_removed') { DL = null; render(); } });
      return;
    }
    try {
      const blob = new Blob([exportPayload()], { type: 'application/json' }), url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = 'theo-8-semaines-' + today() + '.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
      toast('Sauvegarde téléchargée.');
    } catch (e) { toast('Téléchargement impossible : utilise « Copier ».'); }
  },
  exportCopy() {
    const txt = exportPayload(); ui.exportText = txt; render();
    const box = document.getElementById('exportBox');
    const sel = () => { if (box) { box.focus(); box.select(); } };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(() => toast('Sauvegarde copiée. Colle-la dans une note.'), () => { sel(); toast('Copie automatique refusée : le texte est sélectionné, copie-le.'); });
    else { sel(); toast('Le texte est sélectionné : copie-le.'); }
  },
  importPaste() { const t = document.getElementById('importText').value.trim(); if (!t) { toast('Colle d’abord le texte de la sauvegarde.'); return; } ui.importPreview = validateImport(t); render(); },
  importApply() { const v = ui.importPreview; if (!v || !v.ok) return; backupNow(); S = v.data; S.active = S.active && S.sessions[S.active]?.status === 'active' ? S.active : null; S.timer = null; ui.importPreview = null; ui.exportText = null; save(); render(); toast('Données restaurées.'); },
  importCancel() { ui.importPreview = null; render(); },
  restoreBackup() { let bk = null; try { bk = JSON.parse(localStorage.getItem(BKEY) || 'null'); } catch (e) { } if (!bk) return; const cur = S; S = normalize(bk.data); try { localStorage.setItem(BKEY, JSON.stringify({ at: new Date().toISOString(), data: cur })); } catch (e) { } save(); render(); toast('Copie de sécurité restaurée.'); },
  persist() { navigator.storage.persist().then(ok => toast(ok ? 'Stockage durable accordé par le navigateur.' : 'Le navigateur n’a pas accordé le stockage durable : exporte régulièrement.')).catch(() => toast('Demande impossible ici.')); },
  resetAsk() { ui.confirmReset = true; render(); },
  resetCancel() { ui.confirmReset = false; render(); },
  resetDo() { backupNow(); S = defaults(); ui.confirmReset = false; ui.sess = false; save(); renderSession(); render(); toast('Données effacées. Copie de sécurité conservée.'); },
  install() { if (!installEvt) return; installEvt.prompt(); installEvt.userChoice.finally(() => { installEvt = null; render(); }); },
  doPrint() { try { window.print(); } catch (e) { toast('Impression indisponible ici.'); } },
  ...SACT
};
function captureRunForm() {
  const f = ui.runForm && ui.runForm.f; if (!f) return;
  const m = document.getElementById('rfMinutes'), k = document.getElementById('rfKm'), n = document.getElementById('rfNote');
  if (m) f.minutes = m.value; if (k) f.km = k.value; if (n) f.note = n.value;
}
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  unlockAudio();
  if (!el || el.disabled) return;
  const f = ACT[el.dataset.act];
  if (f) { if (el.tagName === 'BUTTON' || el.tagName === 'DIV') e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target, c = el.dataset.chg;
  if (el.id === 'startInput') { setStart(el.value); return; }
  if (el.id === 'importFile') {
    const file = el.files && el.files[0]; if (!file) return;
    if (file.size > 5e6) { ui.importPreview = { ok: false, errors: ['Fichier trop volumineux pour une sauvegarde de cette application.'] }; render(); return; }
    const rd = new FileReader(); rd.onload = () => { ui.importPreview = validateImport(String(rd.result)); render(); }; rd.onerror = () => { ui.importPreview = { ok: false, errors: ['Lecture du fichier impossible.'] }; render(); }; rd.readAsText(file); return;
  }
  if (el.id === 'shakeKcal') { const d = el.dataset.date, v = el.value === '' ? null : clamp(Math.round(+el.value), 0, 3000); S.shakes[d] = { ...(S.shakes[d] || {}), taken: true, kcal: v }; save(); return; }
  if (el.id === 'wDate') { ui.weightDate = el.value; return; }
  if (!c) return;
  if (c === 'path') {
    const p = el.dataset.path, cur = getPath(p);
    let v = el.value;
    if (el.type === 'number' || el.dataset.num) { v = v.trim() === '' ? null : parseFloat(String(v).replace(',', '.')); if (v != null && !isFinite(v)) { el.value = cur ?? ''; return; } }
    if (p === 'profile.name') v = (v || 'Théo').slice(0, 40);
    if (['profile.heightCm', 'profile.startWeightKg', 'profile.gainLowG', 'profile.gainHighG', 'profile.proteinG'].includes(p) && (v == null || v <= 0)) { el.value = cur; return; }
    setPath(p, v); save(); if (p === 'profile.name' || p === 'profile.medical.date') render(); return;
  }
  if (c === 'bool') { setPath(el.dataset.path, el.checked); save(); return; }
  if (c === 'shake') { const d = el.dataset.date; const prev = S.shakes[d] || {}; S.shakes[d] = { taken: el.checked, kcal: el.checked ? (prev.kcal ?? S.profile.recipe.kcal ?? null) : prev.kcal ?? null }; save(); render(); return; }
  if (c === 'mobility') { if (el.checked) S.mobility[el.dataset.date] = true; else delete S.mobility[el.dataset.date]; save(); render(); return; }
  if (c === 'rfCheck') { captureRunForm(); ui.runForm.f[el.dataset.k] = el.checked; renderRunSheet(); return; }
  if (c === 'runDurIn') { const pw = +el.dataset.pw, k = el.dataset.k; S.plan.runs[pw][k] = clamp(Math.round(+el.value || 0), 0, 90); el.value = S.plan.runs[pw][k]; save(); return; }
  if (c === 'sReduced') { const s = curSess(); if (s && s.status === 'active') { s.reduced = el.checked; save(); renderSession(); } return; }
  if (c === 'band' || c === 'grip') { const s = curSess(), e = s && s.ex[+el.dataset.i]; if (e) { e[c] = el.value.slice(0, 60); save(); } return; }
});
document.addEventListener('input', e => {
  const el = e.target;
  if (el.id === 'repsIn') { const s = curSess(), ex = s && s.ex[s.pos]; if (ex && ex.draft) { ex.draft.reps = clamp(Math.round(+el.value || 0), 0, 120); save(); } }
  if (el.id === 'sNote') { const s = curSess(); if (s) { s.note = el.value.slice(0, 400); save(); } }
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !document.getElementById('sheet').hidden) closeSheet(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); if (ui.sess) requestWake(); if (route === 'today') render(); } });
window.addEventListener('storage', e => { if (e.key === KEY && e.newValue) { S = load(); render(); renderSession(); } });

let DL = null;
function boot() {
  route = readRoute();
  if (S.active && S.sessions[S.active]?.status === 'active') ui.sess = true;
  else if (S.active && S.sessions[S.active]?.status === 'done') S.active = null;
  render(); renderSession();
  setInterval(tick, 250);
  if (FRAMED) { try { const u = window.claude && window.claude.use; if (u) window.claude.use('downloads').then(d => { DL = d || null; if (DL && route === 'profile') render(); }, () => { }); } catch (e) { } }
  if (!FRAMED) {
    const add = (rel, href, extra) => { const l = document.createElement('link'); l.rel = rel; l.href = href; if (extra) Object.assign(l, extra); document.head.appendChild(l); };
    add('manifest', 'manifest.webmanifest');
    add('apple-touch-icon', 'icons/apple-touch-icon.png');
    if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) navigator.serviceWorker.register('sw.js').catch(() => { });
  }
}
boot();
